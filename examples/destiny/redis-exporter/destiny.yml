name: redis-exporter
description: Install one isolated Prometheus redis_exporter instance from a pinned release while sharing the host binary safely with other instances.

# One apply manages exactly one exporter instance. instance_name is part of every
# host resource name, so Redis and Sentinel exporters can coexist on one Soul.
input:
  instance_name:
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]{0,31}$"
    description: >-
      Stable per-host instance identifier (for example redis or sentinel). It is
      embedded in systemd/file names; lowercase alphanumeric plus internal hyphens only.

  version:
    type: string
    default: "1.62.0"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: redis_exporter version (GitHub Releases oliver006/redis_exporter).

  # Preserve the release/NIM-595 fail-closed supply-chain contract.
  sha256:
    type: string
    required: true
    pattern: "^sha256:[0-9a-f]{64}$"
    description: >-
      SHA-256 of the redis_exporter tarball (sha256:<hex>). Must match version + arch.

  arch:
    type: string
    default: amd64
    enum: [amd64, arm64]
    description: Architecture of the GitHub release tarball (amd64|arm64).

  ensure:
    type: string
    default: present
    enum: [present, absent]
    description: >-
      present installs/converges this instance; absent tears down only this instance.
      The shared binary is retained while any redis_exporter instance unit remains.

  base_url:
    type: string
    default: "https://github.com/oliver006/redis_exporter/releases/download"
    pattern: "^https://[A-Za-z0-9._/:-]+$"
    description: Release download root; may point to an internal HTTPS mirror.

  allow_private:
    type: boolean
    default: false
    description: Allow a private-resolving release mirror (keeps the SSRF guard by default).

  bin_dir:
    type: string
    default: /usr/local/bin
    pattern: "^/[A-Za-z0-9._/-]+$"
    description: Directory of the host-shared redis_exporter binary.

  listen:
    type: string
    default: ":9121"
    pattern: "^[A-Za-z0-9._-]*:[0-9]{1,5}$"
    description: Per-instance --web.listen-address (Redis :9121, Sentinel :9122).

  redis_addr:
    type: string
    default: "unix:///var/run/redis/redis-server.sock"
    # Strict host:port form deliberately excludes URI userinfo (`user:password@host`).
    # Authentication belongs only in redis_user + the root-only EnvironmentFile.
    pattern: "^(unix:///[A-Za-z0-9._/-]+|rediss?://([A-Za-z0-9._-]+|\\[[0-9A-Fa-f:]+\\]):[0-9]{1,5}(/[0-9]+)?)$"
    description: >-
      Per-instance --redis.addr. Supports unix:///, redis://, and rediss:// targets;
      the Sentinel exporter normally uses redis://127.0.0.1:26379.

  dependency_unit:
    type: string
    required: true
    pattern: "^[A-Za-z0-9@._-]+\\.service$"
    description: >-
      Local systemd dependency for this instance. Use redis-server.service for Redis
      and redis-sentinel.service for Sentinel; independent from the target transport.

  redis_password:
    type: string
    required: true
    secret: true
    min_length: 16
    pattern: "^[^\\r\\n]+$"
    description: >-
      Redis/ACL password. It is rendered only into this instance's root-owned 0600
      EnvironmentFile by a no_log task; never into argv, the unit, state, or logs.

  redis_user:
    type: string
    default: ""
    pattern: "^[A-Za-z0-9._-]*$"
    description: ACL username for --redis.user; empty keeps the requirepass/default-user model.

  extra_args:
    type: array
    default: []
    items:
      type: string
      # One argv token, never leading/trailing whitespace or a systemd newline/directive.
      pattern: "^--[^[:space:]]+$"
    description: >-
      Additional non-secret redis_exporter argv tokens. Never pass credentials here.

  # Optional exporter-toolkit web-config. Secrets are rendered into the instance-specific
  # root-only file, then systemd LoadCredential exposes a protected runtime copy to DynamicUser.
  basic_auth_username:
    type: string
    default: ""
    pattern: "^[A-Za-z0-9._-]*$"
    description: Username for HTTP basic-auth on /metrics; empty disables basic-auth.

  basic_auth_password_hash:
    type: string
    secret: true
    default: ""
    pattern: "^(\\$2[aby]\\$.+)?$"
    description: Bcrypt hash for HTTP basic-auth; written only to the 0600 web-config.

  tls_cert_file:
    type: string
    default: ""
    pattern: "^(/[A-Za-z0-9._/-]+)?$"
    description: Root-readable source path of the TLS server certificate.

  tls_key_file:
    type: string
    default: ""
    pattern: "^(/[A-Za-z0-9._/-]+)?$"
    description: Root-readable source path of the TLS server key; paired with tls_cert_file.

validate:
  - that: "(input.basic_auth_username == '') == (input.basic_auth_password_hash == '')"
    message: basic_auth_username and basic_auth_password_hash must be set together
  - that: "(input.tls_cert_file == '') == (input.tls_key_file == '')"
    message: tls_cert_file and tls_key_file must be set together
  - that: "input.extra_args.all(arg, !arg.startsWith('--redis.addr') && !arg.startsWith('--redis.user') && !arg.startsWith('--redis.password') && !arg.startsWith('--web.listen-address') && !arg.startsWith('--web.config.file'))"
    message: managed address/auth/listen/web-config flags cannot be overridden through extra_args
