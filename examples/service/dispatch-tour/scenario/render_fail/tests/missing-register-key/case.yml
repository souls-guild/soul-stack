# The probe's register is mocked with the fields core.exec.run returns, as the
# first step would leave it; the render then aborts on the key the scenario
# invents. A live run renders the second step only after the first, so it fails
# between steps (README).
name: the second step reads a key the probe never produced

fixtures:
  hosts:
    - sid: node-1.example.com

mocks:
  register:
    probe:
      stdout: "probe\n"
      stderr: ""
      exit_code: 0

expect_render_error: "no such key: no_such_key"
