name: fail_scenario
description: deploy fails on one host; default radius `scenario` ends the run for everybody.

input:
  fail_sid:
    type: string
    required: true
    description: SID of the host whose deploy fails.

tasks:
  - name: prepare
    module: core.exec.run
    changed_when: "false"
    params:
      cmd: echo
      args: ["prepare"]

  - name: deploy
    module: core.exec.run
    register: deploy
    params:
      cmd: sh
      args: ["-c", "${ soulprint.self.sid == input.fail_sid ? 'echo deploy failed on purpose >&2; exit 1' : 'echo deployed' }"]

  - name: after deploy
    module: core.exec.run
    changed_when: "false"
    params:
      cmd: echo
      args: ["after"]
