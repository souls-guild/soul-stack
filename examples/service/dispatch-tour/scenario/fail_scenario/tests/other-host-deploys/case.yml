# The other branch of the same `fail_sid` comparison: a host it does not name
# renders a deploy that succeeds. fail_host and the three rescue scenarios render
# their deploy from this same expression; canary has its own, with its own case.
name: a host fail_sid does not name gets the succeeding deploy

fixtures:
  hosts:
    - sid: node-2.example.com
  input:
    fail_sid: node-1.example.com

assert:
  task_present:
    - module: core.exec.run
      id: deploy
      params_subset:
        cmd: sh
        args: ["-c", "echo deployed"]
