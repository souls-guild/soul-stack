# L0 test for create MongoDB standalone (base case, WITHOUT operator users). Render-only,
# hermetic. Covers: binary-install (Nexus tarball + mongod + its own systemd unit),
# rendering mongod.conf (toYaml — security.authorization enabled + dbPath/port), sysctl drop-in,
# health-gate (community.mongo.pinged without auth), bootstrap default_admin via the localhost
# exception (community.mongo.user for default_admin from vars.system_users).
name: mongo create standalone (binary install + mongod.conf + bootstrap default_admin)

fixtures:
  hosts:
    - sid: node-solo.example.com
      covens: [mongo]
      soulprint:
        network: { primary_ip: 10.0.0.7 }
        os: { arch: amd64, version: "12" }

  vars:
    install_method: binary
    binary_base_url: "https://nexus.example/mongodb"
    binary_allow_private: true
    conf_dir: /etc/mongodb
    data_dir: /var/lib/mongodb
    log_dir:  /var/log/mongodb
    net_port: 27017
    memory_reserve_percent: 50
    system_users:
      default_admin:
        - { role: root, db: admin }
    mongo_config:
      net:
        maxIncomingConnections: 65536
      operationProfiling:
        mode: "off"
        slowOpThresholdMs: 100
    sysctl_settings:
      vm.max_map_count: "262144"
      vm.swappiness:    "1"

  input:
    version: "8.0.4"
    memory_mb: 2048

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.present` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_users:
      effective:
        - { name: default_admin, password: mongoadmin-create-pass }
    mongo_users:
      effective: []

assert:
  task_present:
    # 1. the keeper-side mint of the service's own accounts ([ADR-0083] §4): the path is
    #    derived from (service, incarnation, field, key), no case authors one.
    - module: core.state.present
      params_subset:
        key: system_users

    # 2. binary-install: mongodb user/group + fetch tarball + mongod + systemd unit.
    - module: core.group.present
      params_subset:
        name: mongodb
    - module: core.user.present
      params_subset:
        name: mongodb
    - module: core.url.fetched
      params_subset:
        url: "https://nexus.example/mongodb/x86_64/mongodb-linux-x86_64-8.0.4.tgz"
    - module: core.file.present
      params_subset:
        path: /usr/local/bin/mongod
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/mongod.service

    # 3. Directories + render mongod.conf + sysctl.
    - module: core.directory.present
      params_subset:
        path: /var/lib/mongodb
    - module: core.file.rendered
      params_subset:
        path: /etc/mongodb/mongod.conf
        template_content: "<present>"
        mode: "0640"
        owner: mongodb
        group: mongodb
    - module: core.sysctl.applied
      params_subset:
        filename: 30-mongodb

    # 4. Start + health-gate + bootstrap default_admin.
    - module: core.service.running
      params_subset:
        name: mongod
    - module: community.mongo.pinged
      params_subset:
        addr: "127.0.0.1:27017"
    # ★★ BOOTSTRAP default_admin: localhost-exception. username/name = default_admin,
    # password from the Vault branch, roles root@admin from vars.system_users.
    - module: community.mongo.user
      params_subset:
        addr: "127.0.0.1:27017"
        username: default_admin
        password: mongoadmin-create-pass
        name: default_admin
        database: admin
        state: present

  task_absent:
    # package branch group-drop on a binary incarnation.
    - module: core.pkg.installed
      params_subset:
        name: mongodb-org

  state_changes:
    mongo_version: "8.0.4"
    memory_mb: 2048
    mongo_users: []
