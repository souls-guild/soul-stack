description: >-
  state_schema v1 → v2: the service's own accounts become a declared state field
  (NIM-698, ADR-0083). state is EXTENDED with system_users — an array of {name},
  recording WHICH accounts the service provisioned for itself (PILOT: default_admin).
  Their roles stay in service vars (policy, not a per-incarnation fact); their passwords
  are declared `type: secret`, so the value lives in Vault at a path Keeper derives from
  (service, incarnation, system_users, name) and never in state.

  Forward-only (down: not supported; recovery is via state_history). The default is []
  and not the account list: migration-CEL cannot read vars (ADR-019 sandbox), and the
  account set is a service-vars fact. A v1 incarnation therefore carries no record until
  its next create run writes one.

  ★ The Vault values do NOT move. v1 minted them under the authored path
  secret/mongo/<inc>/users/<name>; v2 derives secret/mongo/<inc>/system_users/<name>.
  The migration DSL is a pure function of state and cannot touch Vault, so a v1
  incarnation's next run fails closed on the missing secret rather than silently
  authenticating with a fresh one. That is the intended failure: an admin credential is
  not something a schema migration may re-point.

  ONE flat set with a has()-guard on the whole field (a repeat run keeps what is there).
  The rest of state (mongo_users/mongo_config/memory_mb/…) is NOT touched. Mirrors
  redis 015_system_acl_users / dragonfly 007_system_acl_users.

transform:
  - set:
      path: state.system_users
      value: >-
        ${ has(state.system_users) ? state.system_users : [] }
