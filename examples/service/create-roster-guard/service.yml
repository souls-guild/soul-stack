state_schema_version: 1
description: >-
  E2E foundation for the create-path topology guard (ADR-009 amendment
  2026-06-23 / NIM-235). The `create` scenario binds a roster of
  already-onboarded Souls with the keeper-side step `core.soul.registered`
  (`refresh_soulprint: true`) and only then asserts the roster size. It is the
  smallest shape of the real bootstrap flow — the roster is a PRODUCT of the
  create run, not an input to it — and it proves that a create scenario
  carrying a topology `assert:` is reachable through POST /v1/incarnations.

# state_schema_version = 1 → no migrations/ directory required (ADR-019).
# The service writes nothing to incarnation.state: the run only binds membership
# and echoes on the bound hosts.
state_schema: {}
# No dependencies: the scenario uses only core modules (ADR-015), which are not
# listed in destiny[]/modules[] (ADR-009).
