# L0 test (Trial, ADR-023) of the hello-world service's create scenario.
#
# Verifies that the render pipeline for input.greeting="hi" produces a
# core.file.present task with path=/tmp/soul-stack-hello and content="hi"
# (CEL interpolation ${ input.greeting }), and that the capture step records the
# path in incarnation.state ([ADR-0084]).
name: create writes greeting file with input.greeting

fixtures:
  input:
    greeting: hi

assert:
  task_present:
    - module: core.file.present
      params_subset:
        path: /tmp/soul-stack-hello
        content: hi

  # The core.state.set step is applied by the same engine the run uses, so the
  # final state is checkable without a host.
  state_after:
    greeting_file: /tmp/soul-stack-hello
