name: converge
description: |
  Reconcile scenario for hello-world. Declares the DESIRED final state of the
  greeting file: the same path and the same content written by scenario/create.
  Run it like any other operational scenario to bring the host back to the
  declaration — core.file.present is idempotent, so a host already in the
  desired state reports no change, and that no-change report IS the answer to
  "has anything drifted".

  It was also the dry-run target of the Scry drift check until NIM-446 removed
  that circuit; nothing special-cases the name `converge` in keeper any more.

# input.greeting is required: the file path is fixed in
# incarnation.state.greeting_file, but the greeting text itself isn't stored in state
# (state_schema only carries greeting_file), so the operator passes the expected
# content on the run.
input:
  greeting:
    type: string
    required: true
    description: Expected greeting-file text (the same one applied in create).

# converge is a pure re-declaration of what create already recorded, so it has
# nothing to add to state.
state_changes: {}

tasks:
  - name: Ensure greeting file matches desired content
    module: core.file.present
    params:
      path: /tmp/soul-stack-hello
      content: "${ input.greeting }"
