name: vars-cycle
description: >
  Negative scenario: delegates to the pilot-vars-cycle destiny, whose vars.yml carries
  a cycle a → b → c → a. The destiny task reads vars.a, and the destiny render pass
  MUST abort with var_cycle and a trace, found on the evaluation path of that read
  (vars evaluated on request, ADR-0082 amendment 2026-10-15). The L0 case verifies
  this via expect_render_error.

input:
  path:
    type: string
    required: true
    pattern: "^/[A-Za-z0-9._/-]+$"
    description: Marker file path.

tasks:
  - name: Apply pilot-vars-cycle destiny
    apply:
      destiny: pilot-vars-cycle
      input:
        marker_file: "${ input.path }"
