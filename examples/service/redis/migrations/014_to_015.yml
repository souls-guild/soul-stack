from_version: 14
to_version: 15

description: >-
  state_schema v14 → v15: the service's own ACL accounts become a declared state field
  (NIM-698, ADR-0083). state is EXTENDED with system_acl_users — an array of {name},
  recording WHICH accounts the service provisioned for itself (default_admin/replica/
  monitoring/sentinel/haproxy). Their perms stay in service vars (policy, not a
  per-incarnation fact); their passwords are declared `type: secret`, so the value lives
  in Vault at a path Keeper derives from (service, incarnation, system_acl_users, name)
  and never in state.

  Forward-only (down: not supported; recovery is via state_history). The default is []
  and not the account list: migration-CEL cannot read vars (ADR-019 sandbox), and the
  account set is a service-vars fact. A v14 incarnation therefore carries no record
  until its next create-class run writes one.

  ★ The Vault values do NOT move. v14 minted them under the authored path
  secret/redis/<inc>/users/<name>; v15 derives secret/redis/<inc>/system_acl_users/<name>.
  The migration DSL is a pure function of state and cannot touch Vault, so a v14
  incarnation's day-2 run fails closed on the missing secret rather than silently
  authenticating with a fresh one. That is the intended failure: an in-cluster
  credential is not something a schema migration may re-point.

  ONE flat set with a has()-guard on the whole field (a repeat run keeps what is there).
  The rest of state (redis_users/redis_config/tls/monitoring/logging/topology) is NOT
  touched.

transform:
  - set:
      path: state.system_acl_users
      value: >-
        ${ has(state.system_acl_users) ? state.system_acl_users : [] }
