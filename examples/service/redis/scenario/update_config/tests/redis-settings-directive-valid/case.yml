# L0 test of the version-aware validator for redis_settings directive names in update_config
# (assert, #6) - POSITIVE case. service vars carries the redis_directives catalog with the 7.2 series;
# the DEPLOYED version (incarnation.state.redis_version) = 7.2.4 → series 7.2.
# redis_settings contains a VALID name (appendfsync ∈ catalog[7.2]) → the assert passes,
# the directive makes it through to hot-reload (redis.instance.configured) and the final redis_config.
#
# Paired with redis-settings-directive-unknown (there a typo breaks the render). Covers
# the assert's true branch and proves the validator doesn't false-block a valid directive.
name: redis_settings with a valid directive name passes the catalog assert

fixtures:
  default_destiny_source: "file://../../destiny/{name}"
  soulprint:
    network: { primary_ip: 10.0.0.5 }
    os: { arch: amd64 }

  vars:
    memory_reserve_percent: 75
    # host-layout - in service vars (v11→v12, Variant A): moved out of state, a repeat run reads it from here.
    conf_dir: /etc/redis
    data_dir: /var/lib/redis
    modules_base_url: "https://artifacts.example.com/redis/modules"
    persistence_presets:
      rdb:
        save: "900 1 300 10 60 10000"
        appendonly: "no"
    redis_directives:
      "7.2":
        - maxmemory
        - maxmemory-policy
        - maxclients
        - timeout
        - appendonly
        - appendfsync
        - save

  state:
    redis_type: sentinel
    redis_version: "7.2.4"
    tls:
      enable:   false
      only:     false
      port:     7379
      cert_ref: ""
      key_ref:  ""
      ca_ref:   ""
    persistence: rdb
    memory_mb: 1024
    maxmemory_policy: allkeys-lru
    redis_config:
      maxmemory:        "768mb"
      maxmemory-policy: allkeys-lru
      save:             "900 1 300 10 60 10000"
      appendonly:       "no"
    redis_users: []

    # ★ [ADR-0083] §4: create recorded the service's own accounts here -- only the
    # NAME; each password is a `type: secret` property living in Vault under a derived
    # path. The day-2 `core.state.set` task resolves THIS list into the register.
    system_acl_users:
      - { name: default_admin }

  input:
    # Operator delta: a VALID passthrough directive (∈ catalog[7.2]). Overrides
    # appendfsync last-wins; the assert lets it through, the directive makes it to hot-reload.
    redis_settings:
      appendfsync: everysec

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.set` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_acl_users:
      effective:
        - { name: default_admin, password: default-admin-secret-pass }
    redis_users:
      effective: []

assert:
  task_present:
    # hot-reload carries the recomputed merged config with the passthrough directive topped up.
    # ★ default_admin REDESIGN: AUTH as default_admin (username + its Vault password).
    - module: redis.instance.configured
      params_subset:
        addr: "127.0.0.1:6379"
        username: default_admin
        password: default-admin-secret-pass
        # rewrite=false (NIM-53): step 1's redis.conf is the file's source of truth.
        rewrite: false
        config:
          maxmemory: "768mb"
          maxmemory-policy: allkeys-lru
          save: "900 1 300 10 60 10000"
          appendonly: "no"
          appendfsync: everysec

  state_after:
    # state.redis_config ≡ config hot-reload (a single compute): passthrough was topped up last-wins.
    redis_config:
      maxmemory: "768mb"
      maxmemory-policy: allkeys-lru
      save: "900 1 300 10 60 10000"
      appendonly: "no"
      appendfsync: everysec
