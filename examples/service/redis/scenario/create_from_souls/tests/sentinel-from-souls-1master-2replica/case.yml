# Sentinel onto an EXISTING roster, taken from fixtures.hosts.
#
# Since NIM-761 removed the provisioning path, `create` rolls onto an existing roster
# too, so this case no longer contrasts with it on THAT axis. What it still pins is the
# `create_from_souls` contract itself: the roster is GIVEN (input.souls, NIM-371), the
# incarnation id is COMPOSED from input components (ADR-079) rather than typed, and no
# onboarding barrier is emitted because the hosts are already there.
name: sentinel deploy on existing roster without provision

fixtures:
  default_destiny_source: "file://../../destiny/{name}"
  # Order in YAML is deliberately unsorted (3, 1, 2) — master election sorts by SID.
  hosts:
    - sid: node-3.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.3 }
        os: { arch: amd64 }
    - sid: node-1.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.1 }
        os: { arch: amd64 }
    - sid: node-2.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.2 }
        os: { arch: amd64 }
  vars:
    install_method: package
    redis_type: sentinel
    sentinel_master_name: master
    sentinel_master_defaults:
      down-after-milliseconds: "5000"
      failover-timeout:        "60000"
    modules_base_url: "https://artifacts.example.com/redis/modules"
    memory_reserve_percent: 75
    persistence_presets:
      rdb:
        save: "900 1 300 10 60 10000"
        appendonly: "no"
    redis_config:
      maxmemory:        "256mb"
      maxmemory-policy: allkeys-lru
      maxclients:       10000
      timeout:          300
    system_acl_users:
      default_admin: "~* &* +@all"
      replica:    "+psync +replconf +ping"
      monitoring: "-@all +@connection +client +ping +info +config|get +cluster|info +slowlog +latency +memory +select +command|count +command|docs"
      sentinel:   "allchannels +multi +slaveof +ping +exec +subscribe +config|rewrite +role +publish +info +client|setname +client|kill +script|kill"
      haproxy:    "-@all +auth +client|getname +client|id +client|setname +command +hello +ping +role +info +cluster|info"
    system_acl_users_sentinel:
      default_admin: "allchannels allkeys +@all"
      monitoring: "-@all +@connection -command +client -hello +info -auth +sentinel|masters +sentinel|replicas +sentinel|slaves +sentinel|sentinels +sentinel|ckquorum"
      sentinel:   "allchannels -@all +auth +client|getname +client|id +client|setname +command +hello +ping +sentinel|is-master-down-by-addr +publish +role +sentinel|get-master-addr-by-name +sentinel|master +sentinel|myid +sentinel|replicas +sentinel|sentinels"
      haproxy:    "-@all +auth +client|getname +client|id +client|setname +command +hello +ping +role +sentinel|get-master-addr-by-name +sentinel|master +sentinel|myid +sentinel|replicas +sentinel|sentinels"
  input:
    # Identity components feeding id_template (ADR-0079): the run composes
    # sessions-billing-checkout-redis-session (service_type is explicit here,
    # the cluster case leaves it to the `cache` default).
    name: sessions
    project: billing
    subproject: checkout
    service_type: session
    redis_type: sentinel
    version: "7.4.1"
    replicas_per_master: 2
    # The ROSTER (NIM-371) — the souls the run deploys onto, mirroring fixtures.hosts.
    # It is declared input now, not an ambient property of the run: `hosts` carries
    # `source: { roster: true }`, so Keeper binds it into incarnation_membership before
    # the run starts. The trial harness has no membership relation — fixtures.hosts IS
    # the roster here — but the value still has to satisfy the input contract, and the
    # size rules in validate: measure exactly this list (1 master + 2 replicas = 3).
    hosts:
      - node-1.example.com
      - node-2.example.com
      - node-3.example.com

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.set` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_acl_users:
      effective:
        - { name: default_admin, password: default-admin-secret-pass }
        - { name: haproxy, password: haproxy-sys-secret-pass }
        - { name: monitoring, password: monitoring-sys-secret-pass }
        - { name: replica, password: replica-sys-secret-pass }
        - { name: sentinel, password: sentinel-sys-secret-pass }
    redis_users:
      effective: []

assert:
  task_present:
    # -- sentinel destiny: redis.conf (sentinel mode: NO cluster directives) --
    # render_context.self = host first by SID (node-1, host invariant apply.input).
    - module: core.file.rendered
      params_subset:
        path: /etc/redis/redis.conf
        template_content: "<present>"
        mode: "0640"
        owner: redis
        group: redis
        render_context:
          vars:
            conf_dir: /etc/redis
            data_dir: /var/lib/redis
            port: 6379
            run_dir: /var/run/redis
            log_dir: /var/log/redis
            loadmodules:
              - /var/lib/redis/modules/redisbloom.so
              - /var/lib/redis/modules/rejson.so
              - /var/lib/redis/modules/redisearch.so
              - /var/lib/redis/modules/redistimeseries.so
            config:
              # ★ default_admin REDESIGN: replica->master AUTH (masteruser/
              # masterauth) arrives as REGULAR config directives (the sentinel
              # deploy-body fills them via vault()-in-cell) → redis.conf ranges over
              # them like any directive → statically survives a restart.
              masteruser:       "default_admin"
              masterauth:       "default-admin-secret-pass"
              maxmemory:        "256mb"
              maxmemory-policy: allkeys-lru
              maxclients:       10000
              timeout:          300
              save:             "900 1 300 10 60 10000"
              appendonly:       "no"
          self:
            sid: node-1.example.com
            covens: [redis]
            choirs: []
            traits: {}
            role: ""
            network:
              primary_ip: 10.0.0.1
            os:
              arch: amd64
          role: ""

    # -- REPLICAOF for replicas (redis.replica.present) --------------------
    # addr=127.0.0.1:6379 (per-host local invariant), master_addr — master election
    # (first by SID = node-1 = 10.0.0.1). The task carries where (renders only on
    # replicas, master does NOT carry it).
    - module: redis.replica.present
      params_subset:
        addr: "127.0.0.1:6379"
        master_addr: "10.0.0.1:6379"
        # ★ default_admin REDESIGN: replica->master AUTH as default_admin.
        username: default_admin
        password: default-admin-secret-pass

    # -- SENTINEL MONITOR reconcile (redis.sentinel.monitored) ---------------
    # monitor.ip — HOST-INVARIANT master address (master election node-1). quorum=2
    # (AUTO: size(3)/2+1). master_name=master (service vars default).
    - module: redis.sentinel.monitored
      params_subset:
        addr: "127.0.0.1:26379"
        master_name: master
        # ★ default_admin REDESIGN: CONNECTION-AUTH (username/password) + master
        # monitoring (auth_user/auth_pass) as default_admin.
        username: default_admin
        password: default-admin-secret-pass
        auth_user: default_admin
        auth_pass: default-admin-secret-pass
        redis_version: "7.4.1"
        config:
          "sentinel down-after-milliseconds master": "5000"
          "sentinel failover-timeout master": "60000"
        monitor:
          ip: 10.0.0.1
          port: 6379
          quorum: 2

  task_absent:
    # The onboarding barrier is ABSENT: create_from_souls is GIVEN its hosts, so it
    # never registers or awaits one. (`core.cloud.created` used to be asserted absent
    # here too; the module no longer exists, so the assertion proved nothing — NIM-761.)
    - module: core.soul.registered

  state_after:
    redis_type: sentinel
    redis_version: "7.4.1"
    redis_config:
      maxmemory:        "256mb"
      maxmemory-policy: allkeys-lru
      maxclients:       10000
      timeout:          300
      save:             "900 1 300 10 60 10000"
      appendonly:       "no"
    redis_users: []
    redis_hosts: []
    redis_sentinel:
      master_name: master
      quorum: 0
      master_settings:
        down-after-milliseconds: "5000"
        failover-timeout: "60000"
      settings: {}
    replicas: 2
    sentinel_quorum: 0
    shards: 0
    persistence: rdb
    maxmemory_policy: ""
    tls:
      enable:   false
      only:     false
      port:     7379
      cert_ref: ""
      key_ref:  ""
      ca_ref:   ""
    memory_mb: 0
    modules: [bloom, json, search, timeseries]
    sysctl_settings: {}

  # ★ The three cloud-provision fields are ABSENT, not empty. They are a leftover of the
  # removed provisioning path (NIM-761) that the migration ladder still carries, so an
  # incarnation created today never has them written ([ADR-0084] F-B).
  state_absent:
    - provisioned_vm_ids
    - provisioned_sids
    - provisioned_provider
