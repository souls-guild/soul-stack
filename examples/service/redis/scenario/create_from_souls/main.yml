name: create_from_souls
# create: true — startup scenario (bootstrap of a new incarnation): selected on
# POST /v1/incarnations (scenario.ResolveCreateScenarios reads the flag, scenario.go::Create).
create: true
description: >-
  Deploy Redis onto a ready roster of already onboarded online souls — same as create, but
  without the cloud-provision phase: the run rolls out onto existing hosts. Same input and the
  same translation of simple concepts into a full redis.conf.

# ── extends: covenant — shared section contract (S4 rollout) ────────────────────────────
# The input / compute / validate sections live in covenant.yml (root of the
# service repo) and are inherited add-only: the keeper-side resolver merges covenant FIRST,
# and the create_from_souls delta ADDS on top (never overriding covenant keys — otherwise
# section_key_conflict).
#
# ★ create_from_souls DELTA — NEAR-MINIMAL (create's twin without provision):
#   - input  — the four identity components feeding name_template, plus `hosts`: the ROSTER
#     this run deploys onto (NIM-371). covenant does NOT carry the provision section (that's
#     create's delta, ADR-061), and create_from_souls has no provision at all → the three
#     provisioned_* fields are never captured here and stay ABSENT (the capture steps live in
#     the provision body itself, which this scenario does not include; every reader defaults
#     them, [ADR-0084] F-B).
#     ★ `hosts` is where create and create_from_souls genuinely differ in KIND: create
#     PRODUCES its hosts (provision), this one is GIVEN them, so where they come from has to
#     be part of the request.
#   - compute — ONLY sentinel_monitor_now (covenant does NOT carry it: it diverges from
#     migrate_cluster by value). On create semantics =true (node-1 is the real master, sentinel
#     monitors it right away — no role:slave fill-in phase, unlike migrate_cluster).
#   - tasks carry the state capture steps — the same 18 as create minus provisioned_*: a
#     covenant carries no tasks, so each inheritor writes its own ([ADR-0084] F-B).
#   - validate — the roster-size rules (NIM-371): the count of `hosts` against the declared
#     topology. Appended to covenant's rules (this section merges add-only).
#   - form / tasks — strictly local (form is NOT merged; tasks — a dispatcher by redis_type
#     WITHOUT provision: the run rolls straight onto the existing roster).
extends: covenant

# ── Computed scenario vars: create_from_souls DELTA on top of covenant.compute ──────
# The shared compute contract lives in covenant.yml (inherited covenant-first). Here — ONLY
# sentinel_monitor_now: covenant does NOT carry it (section_key_conflict with migrate_cluster,
# where the value differs). On create semantics =true UNCONDITIONALLY: node-1 is the real
# master, there is no role:slave fill-in phase → sentinel monitors it right away (the deploy body
# redis-deploy-sentinel.yml proxies the flag into a task-var in step 4). See the header of
# redis-deploy-sentinel.yml.
compute:
  sentinel_monitor_now: "${ true }"

# ── Composed incarnation name (name_template, ADR-0079) ──────────────────────────────
# The operator does NOT type a name: it is assembled Keeper-side from the identity
# components below, over the RESOLVED input (defaults merged) and BEFORE the row is
# inserted. `name` in POST /v1/incarnations is then optional — and sending it against
# this scenario is a 422 (the name is derived, not negotiated).
#
# ★ 63-CHARACTER CEILING. incarnation.name is a TEXT PRIMARY KEY, kebab-case, at most
# 63 characters, and IMMUTABLE — there is no rename. The literal text here costs 9 of
# those characters ("-", "-", "-redis-"), so the four components share what is left;
# that is why each carries an explicit max_length below (12+12+12+7 + 9 = 52, with
# headroom). Overflow is a 422 naming the composed string and its length, NEVER a
# truncation — a shortened name would be a DIFFERENT identity.
#
# ★ Components are WRITE-ONCE IDENTITY. The template is read only on the create path;
# running a day-2 scenario later with a different `project` changes what that run does,
# not what the incarnation is called. Nothing renames an incarnation.
#
# ★ The pattern on each component is what actually keeps the name legal: `${ … }` blocks
# are stringified as-is, so an underscore or a capital in a component would compose an
# invalid name and be rejected at create. Validating the PARTS is the cheap place to
# catch it (soul-lint cannot — the values are the operator's).
name_template: "${input.name}-${input.project}-${input.subproject}-redis-${input.service_type}"

# ── Input: create_from_souls DELTA on top of covenant.input ──────────────────────────
# The shared contract (redis_type/version/memory_mb/persistence/users/…) lives in
# covenant.yml and is merged add-only. Here — ONLY the four identity components that
# feed name_template; covenant does not carry them (they are about WHO the instance is,
# not HOW Redis is configured).
input:
  # ── The ROSTER — the souls this run rolls onto (NIM-371) ───────────────────────────
  # `source: { roster: true }` is what makes this field the incarnation's composition
  # rather than one more parameter of it. Two things read that declaration:
  #
  #   - the UI renders a SID picker over the free, onboarded, online souls the operator
  #     may see, narrowed to the covens this incarnation declares;
  #   - Keeper BINDS the chosen SIDs into `incarnation_membership` after inserting the
  #     row and BEFORE starting this run.
  #
  # ★ WHY THE BIND IS THE LOAD-BEARING PART. A run resolves its roster from
  # `incarnation_membership` at start (topology.LoadIncarnationHosts) and aborts
  # `no_hosts` on an empty one. A scenario therefore cannot bind its own roster — it
  # never reaches its first task. Before this field existed, create_from_souls could
  # only be reached by creating the incarnation, binding hosts through the Hosts tab,
  # and running the scenario by hand; the create form said as much in a hint.
  #
  # ★ input.hosts IS A JOURNAL, MEMBERSHIP IS THE TRUTH. This value records what the
  # incarnation was created ON, write-once like every other input. The live
  # composition is the membership relation, edited afterwards through the Hosts tab —
  # so the two legitimately diverge once a host is added or removed, and the roster
  # of a LATER run is the relation, never this field.
  #
  # ★ The COUNT is checked, but not here: `validate:` below rejects a roster that does
  # not match the declared topology, on the request path, before anything is created.
  hosts:
    type: array
    required: true
    min_items: 1
    max_items: 200
    unique: true
    items:
      type: string
      format: sid
      source: { roster: true }
    description: >-
      Souls this Redis is deployed onto — already onboarded and online. The count must match
      the topology: shards*(1+replicas_per_master) for cluster, 1+replicas_per_master for sentinel.

  name:
    type: string
    required: true
    pattern: "^[a-z0-9][a-z0-9-]*$"
    max_length: 12
    description: Instance role within the subproject, first segment of the name (e.g. cache, sessions).
  project:
    type: string
    required: true
    pattern: "^[a-z0-9][a-z0-9-]*$"
    max_length: 12
    description: Owning project, second segment of the name (e.g. billing).
  subproject:
    type: string
    required: true
    pattern: "^[a-z0-9][a-z0-9-]*$"
    max_length: 12
    description: Subsystem within the project, third segment of the name (e.g. invoices).
  service_type:
    type: string
    default: cache
    enum: [cache, queue, session, lock]
    description: What this Redis is FOR — the trailing segment of the name. Purpose, not topology (topology is redis_type).

# ── Presentation layer of the form (form:, top-level scenario key) ───────────────────
# form: — PURE PRESENTATION. The input contract lives in covenant.input (the effective input
# after merge). ★ There is no provision section here (unlike create) — create_from_souls carries
# no provision field, and the form does not show one.
# ── Validate: create_from_souls DELTA on top of covenant.validate ────────────────────
# Rules are appended to the covenant's (merge is add-only for this section), and are
# INPUT-ONLY like every validate rule — which is exactly why the roster size can be
# checked here at all: both sides of the comparison are operator input.
#
# ★ WHY THIS DUPLICATES THE SIZE-GUARD IN cluster.yml. That one is an `assert:` over
# `soulprint.hosts` — the run's REAL roster — and it stays the authority: it catches a
# host that fell out of the roster between create and render. But an assert reached
# through the CREATE path is deferred to render (pre-flight runs BEFORE
# incarnation.Create, so there is no roster to measure — NIM-235), and a failure there
# is an `error_locked` the operator has to unlock. The rule here answers the same
# question one layer earlier, on the request, as a 422: nothing is created, nothing to
# unlock. The web form counts the same way a third time, so the operator is stopped
# before they submit — three checks, in order of how cheap the refusal is.
#
# ★ cluster_topology takes precedence when given, matching the assert in cluster.yml:
# then the node count is the sum of the declared shard sizes, not the formula.
validate:
  - that: "input.redis_type != 'cluster' || has(input.cluster_topology) || size(input.hosts) == int(input.shards) * (1 + int(input.replicas_per_master))"
    message: "cluster mode needs exactly shards*(1+replicas_per_master) souls in the roster: pick that many, otherwise the plugin would derive the shard count from the node count and ignore the declared shards."
  - that: "input.redis_type != 'sentinel' || size(input.hosts) == 1 + int(input.replicas_per_master)"
    message: "sentinel mode needs exactly 1+replicas_per_master souls in the roster (one master plus its replicas): adjust the roster or replicas_per_master."

form:
  sections:
    # 0. Roster — the souls the run rolls onto. FIRST, because it is the one thing this
    # scenario cannot do without and the one create does not ask for at all: the
    # operator picks WHERE before they describe WHAT.
    - key: roster
      title: "Roster"
      description: "Already onboarded, online souls this Redis is deployed onto"
      fields:
        - name: hosts
          label: "Souls"
          hint: "Free onboarded souls in the declared covens. Pick exactly as many as the topology needs: shards*(1+replicas) for cluster, 1+replicas for sentinel."

    # 1. Identity — the components name_template composes the incarnation name from.
    # ★ These are NOT settings: they are write-once identity (see name_template above),
    # so the UI shows them once, at create, with a live preview of the composed name.
    - key: identity
      title: "Identity"
      description: "The name is composed from these: {name}-{project}-{subproject}-redis-{service_type}"
      fields:
        - { name: name, label: "Instance", placeholder: "cache" }
        - { name: project, label: "Project", placeholder: "billing" }
        - { name: subproject, label: "Subproject", placeholder: "invoices" }
        - { name: service_type, label: "Purpose" }

    # 2. Redis parameters — mode, network channel, version.
    - key: redis
      title: "Redis Parameters"
      description: "Deployment mode, network channel, and version"
      fields:
        - { name: redis_type, label: "Deployment Mode" }
        - { name: connection_mode, label: "Network Channel" }
        - { name: version, label: "Redis Version" }

    # 3. Topology — replicas (both modes) + cluster specifics.
    - key: topology
      title: "Topology"
      description: "Replicas (both modes) and Cluster parameters"
      fields:
        - name: replicas_per_master
          label: "Replicas per master"
          placeholder: "2"
          hint: "Replicas per master. Default is 2 (master + 2 replicas). 0 = no replicas."
        - name: shards
          label: "Number of master shards (cluster)"
          show_when: "input.redis_type == 'cluster'"
          placeholder: "3"
          hint: "16384 hash slots are split evenly across shards (min 3). The run's roster must be shards*(1+replicas)."
        - name: cluster_node_timeout
          label: "Gossip timeout, ms (cluster)"
          show_when: "input.redis_type == 'cluster'"
          placeholder: "5000"
          hint: "Gossip timeout between cluster nodes (cluster-node-timeout). Unset -> 5000."
        - name: cluster_topology
          label: "Explicit shard topology (cluster)"
          show_when: "input.redis_type == 'cluster'"
          hint: "List of shards; each shard is a list of SIDs [master, replica, …] (first = master). The operator distributes VMs across zones themselves. Unset -> the plugin lays out roles by sorted SID automatically."

    # 4. Resources — memory, I/O threads, eviction policy.
    - key: resources
      title: "Resources"
      fields:
        - name: memory_mb
          label: "Data volume, MB"
          placeholder: "1024"
          hint: "Memory budget for Redis on the host. maxmemory is computed as a fraction of it (minus OS reserve). Unset -> maxmemory from the service vars baseline."
        - name: io_threads
          label: "I/O threads"
          placeholder: "0"
          hint: "Number of Redis I/O threads (io-threads). 0 = single-threaded I/O. >0 — typically core count - 1."
        - { name: maxmemory_policy, label: "Eviction Policy" }

    # 5. Persistence — save mode.
    - key: persistence
      title: "Persistence"
      fields:
        - { name: persistence, label: "Persistence Mode" }

    # 6. Users — ACL.
    - key: users
      title: "Users"
      fields:
        - { name: users, label: "ACL Users" }

    # 7. Configuration — passthrough directives for redis.conf and sentinel.conf.
    - key: config
      title: "Configuration"
      description: "Passthrough directives for redis.conf and sentinel.conf"
      collapsed: true
      fields:
        - { name: redis_settings, label: "redis.conf directives" }
        - name: sentinel_settings
          label: "sentinel.conf directives (global)"
          show_when: "input.redis_type == 'sentinel'"
          hint: "Global sentinel.conf directives (resolve-hostnames, announce-port, …)."
        - name: sentinel_master_settings
          label: "Sentinel directives (per-master)"
          show_when: "input.redis_type == 'sentinel'"
          hint: "Per-master options (down-after-milliseconds, failover-timeout, parallel-syncs, …). Defaults: down-after 5000, failover-timeout 60000."

# Run body — dispatcher branches, one per mode (CONDITIONAL-INCLUDE, orchestration.md §6,
# Variant B group-drop). ★ DIFFERENCE FROM create: NO include of redis-provision.yml (there is
# no provision phase at all) — the run rolls straight onto the existing roster. include order —
# cluster, sentinel; indices don't matter (branches are mutually exclusive by enum). An unknown
# redis_type is rejected by Keeper's input validation on the enum BEFORE render.
tasks:
  # ── Mint this run's ACL passwords ([ADR-0083] §4) ─────────────────────────────
  # No scenario writes a Vault path any more. A `core.state.*` write is the only
  # read-or-write of a state field that carries declared secrets: it DERIVES the path
  # from (service, incarnation, state field, account name), mints what is missing and
  # returns the effective state with every `type: secret` property replaced by its
  # `vault:` reference. The generated VALUE never leaves the keeper — not into the
  # register, not into an audit payload, not into `incarnation.state`.
  #
  # ★ PASSAGE INVARIANT, now DECLARED rather than argued: the deploy bodies read
  # `register.<name>.effective` inside `params:` / `apply: input:`, which is
  # passage-defining (shared/config.collectTaskReads) — a real register edge puts every
  # consumer in a strictly later passage than these two. The former construction leaned
  # on the vault-emitter and roster axes, neither of which the author could see from the
  # file, and both of which had to be re-derived to be trusted.

  - name: Mint the passwords of the service's own ACL accounts
    on: keeper
    module: core.state.set
    register: system_acl_users
    params:
      field: system_acl_users
      # compute.system_acl_names (covenant) is the union of vars.system_acl_users and
      # vars.system_acl_users_sentinel — the SAME source the render below reads, so
      # "what we mint" and "what we read" cannot drift. generate_secret() evaluates to a
      # request, not a value: it cannot be stringified, concatenated or logged.
      value: >-
        ${ compute.system_acl_names.map(name, {
             'name':     name,
             'password': generate_secret({'length': 32, 'charset': 'alphanumeric'})
           }) }

  - name: Mint the passwords of the operator ACL users
    on: keeper
    module: core.state.set
    register: redis_users
    params:
      field: redis_users
      # A declared secret resolves, never rotates: an account that already holds a value
      # keeps it, so a re-run never breaks a client. An empty input.users is the
      # legitimate "no operator-extra" case and needs no `when` guard — an empty
      # collection is a valid value here (core.vault.kv-present rejected an empty targets
      # list, which is the only reason the old form carried one).
      value: >-
        ${ default(input.users, []).map(u, {
             'name':     u.name,
             'perms':    u.perms,
             'state':    default(u.state, 'on'),
             'password': generate_secret({'length': 32, 'charset': 'alphanumeric'})
           }) }

  # ── Version-aware validator for redis_settings directive names (assert) ─────────────────
  # redis_settings — passthrough KEY→VALUE: the input schema accepts ANY key. This assert
  # checks EVERY directive NAME against the catalog of valid names FOR THE CHOSEN version
  # (vars.redis_directives[<series>]) — the first unknown key breaks render (422) BEFORE
  # applying. assert (not validate): the catalog lives in service vars, the validate context is
  # INPUT-ONLY. Kept in sync with create. EMPTY-CATALOG-SKIP: the catalog is optional (minimal
  # L0 fixtures).
  - name: Validate redis_settings directive names against the catalog for the chosen Redis version
    assert:
      that:
        - "!has(vars.redis_directives) || default(input.redis_settings, {}).all(k, vars.redis_directives.all(s, compute.redis_version.matches('^([0-9]+:)?' + s + '[.]') ? (k in vars.redis_directives[s]) : true))"
      message: "redis_settings contains an unknown redis.conf directive for the chosen Redis version (input.version): check the name against the catalog of valid directives for this version (vars.redis_directives[<major.minor>]) — a typo or a directive from a different Redis version. The catalog is generated by scripts/gen-redis-catalog.sh from src/config.c."

  # ── Deploy body — dispatcher branches by redis_type (no provision) ──────────────────
  # The run rolls straight onto the existing roster (onboarded by the operator beforehand).
  - include: cluster.yml
    when: "input.redis_type == 'cluster'"
  - include: sentinel.yml
    when: "input.redis_type == 'sentinel'"

  # ── incarnation.state capture ───────────────────────────────────────────────────
  # What was deployed, recorded field by field by keeper-side steps ([ADR-0084]). The
  # expressions read compute.*/input.*/vars.* only, so they are safe at the end of the run
  # and carry no register edge. The VALUES stay defined once — in covenant.yml's compute —
  # while the STEPS are local to each scenario: a covenant is a contract, not a task list
  # (ADR-0084 F-B, decision B2). redis_users/system_acl_users are NOT here: their capture
  # is the minting step at the top of this body ([ADR-0083] §4).

  - name: Record the deployed topology type
    on: keeper
    module: core.state.set
    params:
      field: redis_type
      value: "${ input.redis_type }"

  - name: Record the deployed Redis version
    on: keeper
    module: core.state.set
    params:
      field: redis_version
      value: "${ compute.redis_version }"

  # redis_config ≡ the branches' apply.input.config: a single compute.redis_config, declared once in the covenant compute.
  - name: Record the effective Redis config
    on: keeper
    module: core.state.set
    params:
      field: redis_config
      value: "${ compute.redis_config }"

  # ── Named intent fields (read-model, v3) ─────────────────────────────
  # ★ CRITICAL (architect a9e1c2c6): values are taken from the SAME compute.*/input as
  # redis_config - not from raw input separately. So namedfields (intent) and
  # redis_config (the computed result) are consistent by construction (a single compute pass).
  # tls: the same compute.tls_on/tls_only_on/tls_port/tls_*_ref that produced the TLS block in
  # redis_config (cert/key/ca - Vault PATHS, not PEM: the secret doesn't live in state).
  - name: Record the TLS material references
    on: keeper
    module: core.state.set
    params:
      field: tls
      value: >-
        ${ {
             'enable':   compute.tls_on,
             'only':     compute.tls_only_on,
             'port':     compute.tls_port,
             'cert_ref': compute.tls_cert_ref,
             'key_ref':  compute.tls_key_ref,
             'ca_ref':   compute.tls_ca_ref
           } }

  # connection_mode: the operator's explicit network channel mode (enum tls/tls_plain/plain).
  # the read-model duplicates the choice; the tls namedfield above carries the derived enable/only/port.
  - name: Record the operator's connection mode
    on: keeper
    module: core.state.set
    params:
      field: connection_mode
      value: "${ input.connection_mode }"

  # persistence: input.persistence (default rdb) - the same key used to select
  # vars.persistence_presets in redis_config (the read-model duplicates the operator's choice).
  - name: Record the effective persistence preset
    on: keeper
    module: core.state.set
    params:
      field: persistence
      value: "${ input.persistence }"

  # memory_mb: the operator's memory budget (int). Not set → 0 (a flat set always
  # creates the key; 0 = "the operator didn't pin a budget", maxmemory comes from service vars).
  - name: Record the deployed memory budget
    on: keeper
    module: core.state.set
    params:
      field: memory_mb
      value: "${ int(default(input.memory_mb, 0)) }"

  # maxmemory_policy: the operator's explicit choice; not set → '' (the directive comes from the service vars
  # substrate, see redis_config). The namedfield marks the ABSENCE of an explicit choice with an empty
  # string (we don't reach into redis_config for the actual value - this is a write-model).
  - name: Record the deployed maxmemory policy
    on: keeper
    module: core.state.set
    params:
      field: maxmemory_policy
      value: "${ default(input.maxmemory_policy, '') }"

  # io_threads: the operator's number of I/O threads (int, default 0). 0 = single-threaded I/O
  # (the io-threads directive isn't written to redis.conf). the read-model duplicates the choice.
  - name: Record the deployed io-threads count
    on: keeper
    module: core.state.set
    params:
      field: io_threads
      value: "${ int(input.io_threads) }"

  # modules: the Redis modules ACTUALLY deployed (the "modules are ALWAYS ALL" directive). Redis
  # < 8 → the full set (destiny loads all of them from vars.redis_modules); Redis 8+ → [] (modules
  # are built in). NOT an operator choice (input.modules was removed) - compute.redis_modules_deployed.
  - name: Record the Redis modules actually deployed
    on: keeper
    module: core.state.set
    params:
      field: modules
      value: "${ compute.redis_modules_deployed }"

  # ★ install + host-layout (conf_dir/data_dir/modules_base_url) moved into service vars
  # (v11→v12, Variant A): install - a read-model with no readers, layout - day-2 reads
  # service vars directly (default(vars.<x>, '<default>')). There are no capture steps for them here -
  # the keys aren't in state_schema, a set would write a field outside the schema → state validation would fail.
  # sysctl_settings: the applied host tuning (the same vars.sysctl_settings that
  # goes into destiny apply.input). from service vars (host-invariant, not operator input).
  - name: Record the applied host tuning
    on: keeper
    module: core.state.set
    params:
      field: sysctl_settings
      value: "${ default(vars.sysctl_settings, {}) }"

  # monitoring: a read-model of the FACT of deployed exporters (Slice I, symmetric with the install/tls
  # read-model). Versions/ports - from vars.node_exporter_*/redis_exporter_* (the same values
  # that go into apply.input of the two destinies in create/main.yml). The password/user of the ACL
  # monitoring user are NOT stored in state (security - they're in Vault, like tls.*_ref). The defaults
  # duplicate the service vars / migration 012_to_013 (ports :9100/:9121 are conventional; versions - from the service vars substrate).
  - name: Record the deployed exporters
    on: keeper
    module: core.state.set
    params:
      field: monitoring
      value: >-
        ${ {
             'node_exporter_version':  default(vars.node_exporter_version, ''),
             'redis_exporter_version': default(vars.redis_exporter_version, ''),
             'node_exporter_listen':   default(vars.node_exporter_listen, ':9100'),
             'redis_exporter_listen':  default(vars.redis_exporter_listen, ':9121')
           } }

  # logging: a read-model of the FACT of deployed log-shipping (Slice V-I, ADR-067; symmetric with
  # monitoring). Version/sink_type/endpoint/log_sources - from vars.vector_* (the same values
  # that go into the destiny vector apply.input in create/main.yml). ★ vector_sink_auth_ref is NOT
  # written HERE - it's a secret (Vault ref/token), it doesn't land in state (security, like tls.*_ref and the
  # monitoring password). The defaults duplicate the service vars / migration 013_to_014 (console - a safe default with no
  # infra required; version from the service vars substrate). The operator sees what's deployed; a repeat apply is idempotent.
  - name: Record the deployed log shipping
    on: keeper
    module: core.state.set
    params:
      field: logging
      value: >-
        ${ {
             'vector_version':       default(vars.vector_version, ''),
             'vector_sink_type':     default(vars.vector_sink_type, 'console'),
             'vector_sink_endpoint': default(vars.vector_sink_endpoint, ''),
             'vector_log_sources':   default(vars.vector_log_sources, [])
           } }

  # ── Topology (counts) ──────────────────────────────────────────────────────
  # shards/replicas/sentinel_quorum - from the same input.* that the size-guard/cluster-build/
  # sentinel branches use. shards - cluster only (not set → 0). replicas - UNIFIED
  # int(default(input.replicas_per_master, 0)) in both modes (replicas per master;
  # cluster - per shard, sentinel - of the master). sentinel_quorum - ALWAYS 0 (there's no
  # more operator field for it, the quorum is AUTO size/2+1 computed in apply, it isn't materialized in state;
  # 0 = "auto").
  - name: Record the shard count
    on: keeper
    module: core.state.set
    params:
      field: shards
      value: "${ int(default(input.shards, 0)) }"

  - name: Record the replica count per master
    on: keeper
    module: core.state.set
    params:
      field: replicas
      value: "${ int(default(input.replicas_per_master, 0)) }"

  - name: Record the sentinel quorum
    on: keeper
    module: core.state.set
    params:
      field: sentinel_quorum
      value: "${ 0 }"

  # redis_hosts stays empty in ALL modes on purpose: the declared sentinel roles
  # (master-election) live in apply.input.sentinel and the cluster roles are laid out by
  # the plugin — the run roster is not part of the read-model.
  - name: Record an empty host roster
    on: keeper
    module: core.state.set
    params:
      field: redis_hosts
      value: "${ [] }"

  # redis_sentinel: facts about the monitored master (sentinel mode). master_name - from service vars
  # (vars.sentinel_master_name, default 'master'; there's no more operator field for it).
  # quorum isn't materialized in state (the auto-quorum size/2+1 is computed at deploy
  # time, in apply) → 0. master_ip is no longer written
  # (the sentinel_only mode was removed: the master is picked from the roster, host-variant).
  # ★ Redesign: the former named timings down_after_ms/failover_timeout_ms are absorbed into
  # the generalized per-master dict. The read-model stores the EFFECTIVE map of per-master options
  # (master_settings = vars.sentinel_master_defaults over input.sentinel_master_settings,
  # last-wins) and the global settings (input.sentinel_settings) - day-2 reads them by name
  # (like install/tls). Outside sentinel mode - an empty object (only cluster remains).
  - name: Record the monitored master (sentinel mode)
    on: keeper
    module: core.state.set
    params:
      field: redis_sentinel
      value: >-
        ${ (input.redis_type == 'sentinel')
             ? {
                 'master_name':     default(vars.sentinel_master_name, 'master'),
                 'quorum':          0,
                 'master_settings': merge(
                                       default(vars.sentinel_master_defaults, {}),
                                       default(input.sentinel_master_settings, {})
                                     ),
                 'settings':        default(input.sentinel_settings, {})
               }
             : {} }
