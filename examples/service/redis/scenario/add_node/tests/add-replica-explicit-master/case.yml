# L0 test for add_node: REPLICA with an EXPLICIT master (master_sid is set → master.addr
# = the primary_ip of the corresponding host). Paired with add-replica-auto-master:
# confirms that master_sid is threaded through into master.addr (the has(master_sid)
# branch of the ternary), not an empty string. The plugin resolves the master's node-id from this addr.
name: add replica node (explicit master)

fixtures:
  default_destiny_source: "file://../../destiny/{name}"
  hosts:
    - sid: node-1.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.1 }
        os: { arch: amd64 }
    - sid: node-2.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.2 }
        os: { arch: amd64 }
    - sid: node-9.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.9 }
        os: { arch: amd64 }
  vars:
    modules_base_url: "https://artifacts.example.com/redis/modules"
  state:
    redis_type: cluster
    redis_version: "7.4.1"
    redis_config:
      maxmemory: "256mb"
      cluster-enabled: "yes"
      cluster-config-file: "nodes.conf"
      cluster-node-timeout: "5000"
    redis_users: []
    redis_hosts: []

    # ★ [ADR-0083] §4: create recorded the service's own accounts here -- only the
    # NAME; each password is a `type: secret` property living in Vault under a derived
    # path. The day-2 `core.state.set` task resolves THIS list into the register.
    system_acl_users:
      - { name: default_admin }

  input:
    new_node_sid: node-9.example.com
    seed_sid: node-1.example.com
    role: replica
    master_sid: node-2.example.com

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.set` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_acl_users:
      effective:
        - { name: default_admin, password: default-admin-secret-pass }
    redis_users:
      effective: []

assert:
  # GUARD - assert: (not emitted into the plan).
  task_present:
    # ADD-NODE: master.addr = primary_ip of host node-2 (explicit master_sid).
    # The only community.redis.cluster in the plan.
    - module: community.redis.cluster
      params_subset:
        action: add-node
        role: replica
        username: default_admin
        password: default-admin-secret-pass
        new_node:
          addr: "10.0.0.9:6379"
        seed:
          addr: "10.0.0.1:6379"
        master:
          addr: "10.0.0.2:6379"
