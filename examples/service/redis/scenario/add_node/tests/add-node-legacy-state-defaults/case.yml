# L0 test for add_node — has()-SAFE, host-layout from service vars (v11→v12, Variant A).
# Guard: add_node reads conf_dir/data_dir/modules_base_url from service vars via
# default(vars.<x>, '<default>'). When service vars does NOT override host-layout
# (service vars without these keys), default catches the missing leaf and does NOT fail with
# "no such key", returning the default paths. Regression "bare vars.conf_dir" = render fail
# no-such-key on service vars without a host-layout override. Migration from incarnation.state to
# service vars: host layout moved out of state into service vars (v11→v12), a re-run reads it from there.
#
# service vars is INTENTIONALLY without conf_dir/data_dir/modules_base_url (layout not overridden).
# Expected:
#   - render does NOT fail no-such-key (render succeeds, plan is built);
#   - destiny gets the DEFAULT paths: redis.conf → /etc/redis, modules-dir → /var/lib/redis;
#   - the add-node plugin builds endpoints from the roster as usual.
name: add_node tolerates service vars without conf_dir/data_dir/modules_base_url override

fixtures:
  default_destiny_source: "file://../../destiny/{name}"
  hosts:
    - sid: node-1.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.1 }
        os: { arch: amd64 }
    - sid: node-9.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.9 }
        os: { arch: amd64 }
  state:
    redis_type: cluster
    redis_version: "7.4.1"
    redis_config:
      maxmemory: "256mb"
      cluster-enabled: "yes"
      cluster-config-file: "nodes.conf"
      cluster-node-timeout: "5000"
    redis_users: []
    redis_hosts: []

    # ★ [ADR-0083] §4: create recorded the service's own accounts here -- only the
    # NAME; each password is a `type: secret` property living in Vault under a derived
    # path. The day-2 `core.state.set` task resolves THIS list into the register.
    system_acl_users:
      - { name: default_admin }

  input:
    new_node_sid: node-9.example.com
    seed_sid: node-1.example.com
    role: master

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.set` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_acl_users:
      effective:
        - { name: default_admin, password: default-admin-secret-pass }
    redis_users:
      effective: []

assert:
  task_present:
    # redis.conf under the DEFAULT conf_dir (service vars without conf_dir → default /etc/redis):
    # proves default(vars.conf_dir, '/etc/redis') worked, render didn't fail.
    # Disambiguator — path.
    - module: core.file.rendered
      params_subset:
        path: /etc/redis/redis.conf
    # data-dir under the DEFAULT data_dir (service vars without data_dir → default /var/lib/redis):
    # proves default(vars.data_dir, '/var/lib/redis') worked has()-safe on
    # service vars without an override. Disambiguator — path. An UNCONDITIONAL install.yml task
    # (data-dir is created in both install branches, not gated) — always present.
    # ★ NOT modules-dir (/var/lib/redis/modules): after the "modules ALWAYS ALL" redesign
    # (2026-06-25) the modules group is gated on vars.redis_modules_enabled, which requires
    # a NON-EMPTY modules_base_url; service vars without the key → default(vars.modules_base_url,'')
    # = '' → vanilla redis → modules.yml group-drop (no modules-dir in the plan — correct).
    # We prove the data_dir default via the unconditional data-dir task.
    - module: core.directory.present
      params_subset:
        path: /var/lib/redis
    # ADD-NODE plugin: empty master_sid → master.addr empty (role=master). Endpoints
    # from the roster. Proves the re-run reached the end (render didn't abort).
    - module: redis.cluster.node-added
      params_subset:
        role: master
        username: default_admin
        password: default-admin-secret-pass
        new_node:
          addr: "10.0.0.9:6379"
        seed:
          addr: "10.0.0.1:6379"
        master:
          addr: ""
