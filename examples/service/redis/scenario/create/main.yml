name: create
# create: true — the scenario qualifies as the STARTING one (bootstrap of a new incarnation), i.e.
# it is selected on POST /v1/incarnations (scenario.ResolveCreateScenarios reads the flag,
# scenario.go::Create). Membership in the create-set is DECLARATIVE and data-driven:
# the set of starting scenarios = EXACTLY {scenario with `create: true`}. The former hardcoded union
# in keeper (name `create` always in the set as default) is removed (Phase 2 accepted) — `create`
# qualifies as bootstrap not because of its name, but because it carries this flag.
create: true
description: >-
  Deploy Redis from scratch in sentinel or cluster mode onto an EXISTING roster. The
  operator sets simple concepts (mode, memory, persistence, eviction, ACL users,
  shards), and the scenario expands them into a full redis.conf.

# ── extends: covenant — shared section contract (S4 pilot) ───────────────────────────
# Sections input / compute / validate are factored out into covenant.yml (service-repo
# root) and inherited add-only: the keeper-side resolver merges covenant FIRST, the create
# delta ADDS on top (without overriding covenant keys — otherwise section_key_conflict).
# Since NIM-761 removed the cloud-provision body, create's input delta is EMPTY — the
# whole input contract is the covenant's; what is left local here is form (presentation —
# NOT merged, purely local) and tasks (run body — dispatcher by redis_type, then the state
# capture steps: a covenant carries no tasks, so capture is local to each inheritor,
# [ADR-0084] F-B).
extends: covenant

# ── Computed scenario-vars: create's DELTA on top of covenant.compute ────────────────
# The shared compute contract (redis_config/install/conf_dir/data_dir/tls_*/sentinel_directives/
# redis_version/modules_*/…) lives in covenant.yml, inherited add-only (covenant-first). Here —
# ONLY sentinel_monitor_now: covenant does NOT carry it (it diverges from migrate_cluster in
# value, section_key_conflict on merge). Under create semantics it's =true UNCONDITIONALLY:
# node-1 is a real master, there's no role:slave seeding phase → sentinel monitors it right away
# (the redis-deploy-sentinel.yml deploy body proxies the flag into the step-4 task-var). See the header of redis-deploy-sentinel.yml.
compute:
  sentinel_monitor_now: "${ true }"

# ── Form presentation layer (form:, top-level scenario key) ───────────────────
# form: — PURE PRESENTATION: how the UI groups and labels input fields in the Run form.
# The input contract (types/validation/requiredness) lives EXCLUSIVELY in input: above —
# form references fields by name, duplicates or changes nothing. Optional:
# drop the block → the UI renders input flat (forward-compat). soul-lint checks
# invariants (every name ∈ input:, each name in one section, key is unique); an input field
# without a section — WARNING (the UI draws it into the default section at the end), not an error.
form:
  sections:
    # 1. Redis parameters — mode, connection channel, version.
    # install_method removed from the form (2026-06-28): install method is fixed in
    # service vars (binary), the operator doesn't set it.
    - key: redis
      title: "Redis parameters"
      description: "Deployment mode, connection channel and version"
      fields:
        - { name: redis_type, label: "Deployment mode" }
        - { name: connection_mode, label: "Connection channel" }
        - { name: version, label: "Redis version" }

    # 2. Topology — replicas (both modes) + cluster specifics.
    - key: topology
      title: "Topology"
      description: "Replicas (both modes) and Cluster parameters"
      fields:
        - name: replicas_per_master
          label: "Replicas per master"
          placeholder: "2"
          hint: "Replicas per each master. Default 2 (master + 2 replicas). 0 = no replicas."
        # cluster-specific fields: visible ONLY in cluster mode. show_when —
        # presentation, not a gate: shards.required_when on input validation still
        # applies independently (defence-in-depth).
        - name: shards
          label: "Number of master shards (cluster)"
          show_when: "input.redis_type == 'cluster'"
          placeholder: "3"
          hint: "16384 hash slots are split evenly across shards (min 3). The run's roster must be shards*(1+replicas)."
        - name: cluster_node_timeout
          label: "Gossip timeout, ms (cluster)"
          show_when: "input.redis_type == 'cluster'"
          placeholder: "5000"
          hint: "Gossip timeout between cluster nodes (cluster-node-timeout). Unset → 5000."
        - name: cluster_topology
          label: "Explicit shard topology (cluster)"
          show_when: "input.redis_type == 'cluster'"
          hint: "List of shards; each shard is a list of SIDs [master, replica, …] (the first is the master). The operator lays out VMs across zones themselves. Unset → the plugin assigns roles by sorted SID automatically."

    # 3. Resources — memory, I/O threads, eviction policy.
    - key: resources
      title: "Resources"
      fields:
        - name: memory_mb
          label: "Data volume, MB"
          placeholder: "1024"
          hint: "Memory budget for Redis on the host. maxmemory is computed as a share of it (minus the OS reserve). Unset → maxmemory from the service vars substrate."
        - name: io_threads
          label: "I/O threads"
          placeholder: "0"
          hint: "Number of Redis I/O threads (io-threads). 0 = single-threaded I/O. >0 is typically core count - 1."
        - { name: maxmemory_policy, label: "Eviction policy" }

    # 4. Persistence — save mode.
    - key: persistence
      title: "Persistence"
      fields:
        - { name: persistence, label: "Persistence mode" }

    # 5. Users — ACL.
    - key: users
      title: "Users"
      fields:
        - { name: users, label: "ACL users" }

    # 6. Configuration — passthrough directives for redis.conf and sentinel.conf.
    - key: config
      title: "Configuration"
      description: "Passthrough directives for redis.conf and sentinel.conf"
      collapsed: true
      fields:
        - { name: redis_settings, label: "redis.conf directives" }
        # sentinel-specific dicts: visible ONLY in sentinel mode.
        - name: sentinel_settings
          label: "sentinel.conf directives (global)"
          show_when: "input.redis_type == 'sentinel'"
          hint: "Global sentinel.conf directives (resolve-hostnames, announce-port, …)."
        - name: sentinel_master_settings
          label: "Sentinel directives (per-master)"
          show_when: "input.redis_type == 'sentinel'"
          hint: "Per-master options (down-after-milliseconds, failover-timeout, parallel-syncs, …). Defaults: down-after 5000, failover-timeout 60000."

# Run body — dispatcher branches, one per mode (CONDITIONAL-INCLUDE, orchestration.md §6,
# Option B group-drop). include order — cluster, sentinel; indices don't matter (the branches
# are mutually exclusive by enum). There's no separate mode-guard: an unknown redis_type
# is rejected by Keeper's input validation on the enum BEFORE render.
tasks:
  # ── Mint this run's ACL passwords ([ADR-0083] §4) ─────────────────────────────
  # No scenario writes a Vault path any more. A `core.state.*` write is the only
  # read-or-write of a state field that carries declared secrets: it DERIVES the path
  # from (service, incarnation, state field, account name), mints what is missing and
  # returns the effective state with every `type: secret` property replaced by its
  # `vault:` reference. The generated VALUE never leaves the keeper — not into the
  # register, not into an audit payload, not into `incarnation.state`.
  #
  # ★ PASSAGE INVARIANT, now DECLARED rather than argued: the deploy bodies read
  # `register.<name>.effective` inside `params:` / `apply: input:`, which is
  # passage-defining (shared/config.collectTaskReads) — a real register edge puts every
  # consumer in a strictly later passage than these two. The former construction leaned
  # on the vault-emitter and roster axes, neither of which the author could see from the
  # file, and both of which had to be re-derived to be trusted.

  - name: Mint the passwords of the service's own ACL accounts
    module: core.state.set
    register: system_acl_users
    params:
      field: system_acl_users
      # compute.system_acl_names (covenant) is the union of vars.system_acl_users and
      # vars.system_acl_users_sentinel — the SAME source the render below reads, so
      # "what we mint" and "what we read" cannot drift. generate_secret() evaluates to a
      # request, not a value: it cannot be stringified, concatenated or logged.
      value: >-
        ${ compute.system_acl_names.map(name, {
             'name':     name,
             'password': generate_secret({'length': 32})
           }) }

  - name: Mint the passwords of the operator ACL users
    module: core.state.set
    register: redis_users
    params:
      field: redis_users
      # A declared secret resolves, never rotates: an account that already holds a value
      # keeps it, so a re-run never breaks a client. An empty input.users is the
      # legitimate "no operator-extra" case and needs no `when` guard — an empty
      # collection is a valid value here (core.vault.kv-present rejected an empty targets
      # list, which is the only reason the old form carried one).
      value: >-
        ${ default(input.users, []).map(u, {
             'name':     u.name,
             'perms':    u.perms,
             'state':    default(u.state, 'on'),
             'password': generate_secret({'length': 32})
           }) }

  # ── Version-aware validator for redis_settings directive names (assert, #6) ─────────────
  # ★ #6 (2026-06-26): redis_settings — passthrough KEY→VALUE: the input schema lets
  # ANY key through (additional_properties: {type: string}). Without a check the operator would
  # silently drag in a typo (`maxmemoyr 512mb`) or a directive from a different version → the
  # redis-server fails to start on the host (a late, confusing failure). This assert checks
  # EVERY redis_settings directive NAME against the catalog of valid names FOR THE SELECTED
  # version (vars.redis_directives[<series>], generated from the upstream src/config.c) — the
  # first unknown key aborts render (422 assert-failed) BEFORE applying, with a clear message.
  #
  # WHY assert and not validate: the catalog lives in service vars, and the validate context is
  # INPUT-ONLY (service vars are unavailable, a structural CEL barrier). assert sees
  # service vars+input+compute (the full scenario context) — the only mechanism that can reach the
  # catalog. Run-level (once per run), soulprint.hosts isn't needed (the check is
  # host-invariant), but it's available.
  #
  # VERSION — compute.redis_version (= input.version, an enum of upstream releases;
  # ★ redesign: ONE for both install methods — binary downloads binaries of this version, package
  # installs a =version pin; the former cascade "binary → vars.binary_version" is removed).
  # The version carries a major.minor series → assert matches it against the catalog keys.
  #
  # version→series MECHANICS WITHOUT split (StdLib CEL has no .split/.substring): we iterate
  # the catalog keys (.all(s, …)) and match the version against the series with a regex
  # `^([0-9]+:)?<s>[.]` (the trailing `[.]` is the series boundary, so 7.0 doesn't catch 7.04;
  # the epoch prefix `5:` in the regex is optional — back-compat with old distro pins,
  # even though input.version is now a clean enum `8.6.1`). For series the version does NOT
  # belong to, the predicate is vacuously true (short-circuited by the ternary) — the check runs
  # only against "its own" series. A version that falls into NO catalog series (the series
  # is absent from the catalog — e.g. 8.4 not generated yet) → assert skip: we validate
  # ONLY known series. default(input.redis_settings, {}) — the field is optional; .all over {} = true.
  - name: Validate redis_settings directive names against the catalog for the chosen Redis version
    assert:
      # that[] and message must be SCALAR strings (not folded `>-`/`|`):
      # soul-lint requires *ast.StringNode (quoted/plain), a block-scalar = type_mismatch.
      # The predicate is one line (CEL-normalize collapses whitespace): for each redis_settings
      # key k — for each catalog series s that the version belongs to
      # (regex `^([0-9]+:)?<s>[.]`), k must be in vars.redis_directives[s]; series
      # not matching the version are vacuously true (ternary), a version outside the catalog →
      # no series matches → skip.
      #
      # `!has(vars.redis_directives) || …` — EMPTY-CATALOG-SKIP: the catalog is optional.
      # If service vars doesn't carry it (minimal L0-case fixtures, or an operator's service vars
      # without a catalog) — assert skip (nothing to validate against). With a catalog — full check.
      that:
        - "!has(vars.redis_directives) || default(input.redis_settings, {}).all(k, vars.redis_directives.all(s, compute.redis_version.matches('^([0-9]+:)?' + s + '[.]') ? (k in vars.redis_directives[s]) : true))"
      message: "redis_settings contains an unknown redis.conf directive for the selected Redis version (input.version): check the name against the catalog of valid directives for this version (vars.redis_directives[<major.minor>]) — typo or a directive from a different Redis version. The catalog is generated by scripts/gen-redis-catalog.sh from src/config.c."

  - include: cluster.yml
    when: "input.redis_type == 'cluster'"
  - include: sentinel.yml
    when: "input.redis_type == 'sentinel'"

  # ── MANDATORY data-plane monitoring (Slice I) ──────────────────────────────
  # AFTER the deploy branch (cluster/sentinel), create UNCONDITIONALLY (no when-gate) deploys
  # two metrics exporters onto EVERY incarnation host by COMPOSING reusable
  # standalone destinies via apply:destiny (isolated render for each, ADR-009). Monitoring
  # is not an operator choice but a data-service invariant (contract=A: versions/ports/checksum in
  # service vars, covenant.input/form are NOT touched).
  #
  # ★ ORDER (staged-render Passage stratifies this itself): both tasks read the run's roster
  # (arch/password resolve per-host, apply.input carries soulprint.self) → they are
  # roster-CONSUMERS and land in a passage STRICTLY AFTER deploy (redis-server is up, the
  # monitoring ACL user is seeded, the unix socket is listening). No separate register edge is
  # needed — the roster axis pushes them into a later passage, same as deploy's vault()-read.
  - name: Apply node-exporter destiny (host metrics)
    apply:
      destiny: node-exporter
      input:
        version: "${ default(vars.node_exporter_version, '1.8.2') }"
        # arch is NOT passed: the destiny takes it directly from soulprint.self.os.arch (available
        # in destiny-CEL) — an incarnation may mix amd64/arm64 hosts.
        listen: "${ default(vars.node_exporter_listen, ':9100') }"
        # Download root: a service-vars override for an internal mirror/nexus-proxy (hosts without
        # access to github.com); default is GitHub Releases (back-compat).
        base_url: "${ default(vars.node_exporter_base_url, 'https://github.com/prometheus/node_exporter/releases/download') }"
        # SSRF-guard opt-out for private-resolve base_url (the binary_allow_private pattern); default false — the guard stays on.
        allow_private: "${ default(vars.node_exporter_allow_private, false) }"

  # redis-exporter: Redis metrics over a unix socket (--redis.addr=unix://<socket>). ★ Finding B:
  # redis on ACL WITHOUT requirepass (the default_admin redesign removed requirepass) → the
  # exporter MUST authenticate as the monitoring ACL user (redis_user), otherwise WRONGPASS. The
  # password resolves via keeper-side vault() from secret/redis/<inc>/system_acl_users/monitoring#password
  # (the same ACL user as vars.system_acl_users.monitoring, password generated by kv-present
  # ABOVE) — only the VALUE reaches the host (ADR-012). This core example keeps one Redis
  # exporter instance; WB Redis/Sentinel dual-instance wiring belongs to NIM-607.
  - name: Apply redis-exporter destiny (redis metrics)
    apply:
      destiny: redis-exporter
      input:
        instance_name: redis
        version: "${ default(vars.redis_exporter_version, '1.62.0') }"
        sha256:  "${ default(vars.redis_exporter_sha256, '') }"
        listen:  "${ default(vars.redis_exporter_listen, ':9121') }"
        redis_addr: unix:///var/run/redis/redis-server.sock
        dependency_unit: redis-server.service
        base_url: "${ default(vars.redis_exporter_base_url, 'https://github.com/oliver006/redis_exporter/releases/download') }"
        # SSRF-guard opt-out for private-resolve base_url (the binary_allow_private pattern); default false — the guard stays on.
        allow_private: "${ default(vars.redis_exporter_allow_private, false) }"
        redis_user:     monitoring
        redis_password: "${ merge(register.system_acl_users.effective.map(u, { u.name: u.password }))['monitoring'] }"

  # ── MANDATORY data-plane log shipping (Slice V-I, ADR-067) ──────────────────
  # AFTER the exporters, create UNCONDITIONALLY (no when-gate) deploys vector (a log-shipping
  # agent) onto EVERY incarnation host by COMPOSING a reusable standalone destiny via
  # apply:destiny (isolated render, ADR-009). vector COMPLEMENTS node/redis-exporter
  # (metrics, pull) with the log plane (redis logs, push) — not an operator choice but a
  # data-service invariant (contract=A: versions/checksum/sink in service vars). arch is taken by the
  # destiny itself from soulprint.self.os.arch. sink_auth_ref is a Vault ref OR a value: the
  # caller (service vars) passes a ref, resolved Soul-side (the secret doesn't land in state, InfoSec).
  # log_sources — redis logs from service vars (/var/log/redis/*.log). Order: doesn't read the roster
  # (arch is a soulprint destiny-fact), but apply.input carries soulprint.self → roster-consumer
  # → passage AFTER deploy, same as the exporters.
  - name: Apply vector destiny (log shipping)
    apply:
      destiny: vector
      input:
        version:       "${ default(vars.vector_version, '0.40.0') }"
        sha256:        "${ default(vars.vector_sha256, '') }"
        base_url:      "${ default(vars.vector_base_url, 'https://github.com/vectordotdev/vector/releases/download') }"
        # SSRF-guard opt-out for private-resolve base_url (the binary_allow_private pattern); default false — the guard stays on.
        allow_private: "${ default(vars.vector_allow_private, false) }"
        sink_type:     "${ default(vars.vector_sink_type, 'console') }"
        sink_endpoint: "${ default(vars.vector_sink_endpoint, '') }"
        sink_auth_ref: "${ default(vars.vector_sink_auth_ref, '') }"
        log_sources:   "${ default(vars.vector_log_sources, []) }"

  # ── incarnation.state capture ───────────────────────────────────────────────────
  # What was deployed, recorded field by field by keeper-side steps ([ADR-0084]). The
  # expressions read compute.*/input.*/vars.* only, so they are safe at the end of the run
  # and carry no register edge. The VALUES stay defined once — in covenant.yml's compute —
  # while the STEPS are local to each scenario: a covenant is a contract, not a task list
  # (ADR-0084 F-B, decision B2). redis_users/system_acl_users are NOT here: their capture
  # is the minting step at the top of this body ([ADR-0083] §4).

  - name: Record the deployed topology type
    module: core.state.set
    params:
      field: redis_type
      value: "${ input.redis_type }"

  - name: Record the deployed Redis version
    module: core.state.set
    params:
      field: redis_version
      value: "${ compute.redis_version }"

  # redis_config ≡ the branches' apply.input.config: a single compute.redis_config, declared once in the covenant compute.
  - name: Record the effective Redis config
    module: core.state.set
    params:
      field: redis_config
      value: "${ compute.redis_config }"

  # ── Named intent fields (read-model, v3) ─────────────────────────────
  # ★ CRITICAL (architect a9e1c2c6): values are taken from the SAME compute.*/input as
  # redis_config - not from raw input separately. So namedfields (intent) and
  # redis_config (the computed result) are consistent by construction (a single compute pass).
  # tls: the same compute.tls_on/tls_only_on/tls_port/tls_*_ref that produced the TLS block in
  # redis_config (cert/key/ca - Vault PATHS, not PEM: the secret doesn't live in state).
  - name: Record the TLS material references
    module: core.state.set
    params:
      field: tls
      value: >-
        ${ {
             'enable':   compute.tls_on,
             'only':     compute.tls_only_on,
             'port':     compute.tls_port,
             'cert_ref': compute.tls_cert_ref,
             'key_ref':  compute.tls_key_ref,
             'ca_ref':   compute.tls_ca_ref
           } }

  # connection_mode: the operator's explicit network channel mode (enum tls/tls_plain/plain).
  # the read-model duplicates the choice; the tls namedfield above carries the derived enable/only/port.
  - name: Record the operator's connection mode
    module: core.state.set
    params:
      field: connection_mode
      value: "${ input.connection_mode }"

  # persistence: input.persistence (default rdb) - the same key used to select
  # vars.persistence_presets in redis_config (the read-model duplicates the operator's choice).
  - name: Record the effective persistence preset
    module: core.state.set
    params:
      field: persistence
      value: "${ input.persistence }"

  # memory_mb: the operator's memory budget (int). Not set → 0 (a flat set always
  # creates the key; 0 = "the operator didn't pin a budget", maxmemory comes from service vars).
  - name: Record the deployed memory budget
    module: core.state.set
    params:
      field: memory_mb
      value: "${ int(default(input.memory_mb, 0)) }"

  # maxmemory_policy: the operator's explicit choice; not set → '' (the directive comes from the service vars
  # substrate, see redis_config). The namedfield marks the ABSENCE of an explicit choice with an empty
  # string (we don't reach into redis_config for the actual value - this is a write-model).
  - name: Record the deployed maxmemory policy
    module: core.state.set
    params:
      field: maxmemory_policy
      value: "${ default(input.maxmemory_policy, '') }"

  # io_threads: the operator's number of I/O threads (int, default 0). 0 = single-threaded I/O
  # (the io-threads directive isn't written to redis.conf). the read-model duplicates the choice.
  - name: Record the deployed io-threads count
    module: core.state.set
    params:
      field: io_threads
      value: "${ int(input.io_threads) }"

  # modules: the Redis modules ACTUALLY deployed (the "modules are ALWAYS ALL" directive). Redis
  # < 8 → the full set (destiny loads all of them from vars.redis_modules); Redis 8+ → [] (modules
  # are built in). NOT an operator choice (input.modules was removed) - compute.redis_modules_deployed.
  - name: Record the Redis modules actually deployed
    module: core.state.set
    params:
      field: modules
      value: "${ compute.redis_modules_deployed }"

  # ★ install + host-layout (conf_dir/data_dir/modules_base_url) moved into service vars
  # (v11→v12, Variant A): install - a read-model with no readers, layout - day-2 reads
  # service vars directly (default(vars.<x>, '<default>')). There are no capture steps for them here -
  # the keys aren't in state_schema, a set would write a field outside the schema → state validation would fail.
  # sysctl_settings: the applied host tuning (the same vars.sysctl_settings that
  # goes into destiny apply.input). from service vars (host-invariant, not operator input).
  - name: Record the applied host tuning
    module: core.state.set
    params:
      field: sysctl_settings
      value: "${ default(vars.sysctl_settings, {}) }"

  # monitoring: a read-model of the FACT of deployed exporters (Slice I, symmetric with the install/tls
  # read-model). Versions/ports - from vars.node_exporter_*/redis_exporter_* (the same values
  # that go into apply.input of the two destinies in create/main.yml). The password/user of the ACL
  # monitoring user are NOT stored in state (security - they're in Vault, like tls.*_ref). The defaults
  # duplicate the service vars / migration 013_monitoring_read_model (ports :9100/:9121 are conventional; versions - from the service vars substrate).
  - name: Record the deployed exporters
    module: core.state.set
    params:
      field: monitoring
      value: >-
        ${ {
             'node_exporter_version':  default(vars.node_exporter_version, ''),
             'redis_exporter_version': default(vars.redis_exporter_version, ''),
             'node_exporter_listen':   default(vars.node_exporter_listen, ':9100'),
             'redis_exporter_listen':  default(vars.redis_exporter_listen, ':9121')
           } }

  # logging: a read-model of the FACT of deployed log-shipping (Slice V-I, ADR-067; symmetric with
  # monitoring). Version/sink_type/endpoint/log_sources - from vars.vector_* (the same values
  # that go into the destiny vector apply.input in create/main.yml). ★ vector_sink_auth_ref is NOT
  # written HERE - it's a secret (Vault ref/token), it doesn't land in state (security, like tls.*_ref and the
  # monitoring password). The defaults duplicate the service vars / migration 014_logging_read_model (console - a safe default with no
  # infra required; version from the service vars substrate). The operator sees what's deployed; a repeat apply is idempotent.
  - name: Record the deployed log shipping
    module: core.state.set
    params:
      field: logging
      value: >-
        ${ {
             'vector_version':       default(vars.vector_version, ''),
             'vector_sink_type':     default(vars.vector_sink_type, 'console'),
             'vector_sink_endpoint': default(vars.vector_sink_endpoint, ''),
             'vector_log_sources':   default(vars.vector_log_sources, [])
           } }

  # ── Topology (counts) ──────────────────────────────────────────────────────
  # shards/replicas/sentinel_quorum - from the same input.* that the size-guard/cluster-build/
  # sentinel branches use. shards - cluster only (not set → 0). replicas - UNIFIED
  # int(default(input.replicas_per_master, 0)) in both modes (replicas per master;
  # cluster - per shard, sentinel - of the master). sentinel_quorum - ALWAYS 0 (there's no
  # more operator field for it, the quorum is AUTO size/2+1 computed in apply, it isn't materialized in state;
  # 0 = "auto").
  - name: Record the shard count
    module: core.state.set
    params:
      field: shards
      value: "${ int(default(input.shards, 0)) }"

  - name: Record the replica count per master
    module: core.state.set
    params:
      field: replicas
      value: "${ int(default(input.replicas_per_master, 0)) }"

  - name: Record the sentinel quorum
    module: core.state.set
    params:
      field: sentinel_quorum
      value: "${ 0 }"

  # redis_hosts stays empty in ALL modes on purpose: the declared sentinel roles
  # (master-election) live in apply.input.sentinel and the cluster roles are laid out by
  # the plugin — the run roster is not part of the read-model.
  - name: Record an empty host roster
    module: core.state.set
    params:
      field: redis_hosts
      value: "${ [] }"

  # redis_sentinel: facts about the monitored master (sentinel mode). master_name - from service vars
  # (vars.sentinel_master_name, default 'master'; there's no more operator field for it).
  # quorum isn't materialized in state (the auto-quorum size/2+1 is computed at deploy
  # time, in apply) → 0. master_ip is no longer written
  # (the sentinel_only mode was removed: the master is picked from the roster, host-variant).
  # ★ Redesign: the former named timings down_after_ms/failover_timeout_ms are absorbed into
  # the generalized per-master dict. The read-model stores the EFFECTIVE map of per-master options
  # (master_settings = vars.sentinel_master_defaults over input.sentinel_master_settings,
  # last-wins) and the global settings (input.sentinel_settings) - day-2 reads them by name
  # (like install/tls). Outside sentinel mode - an empty object (only cluster remains).
  - name: Record the monitored master (sentinel mode)
    module: core.state.set
    params:
      field: redis_sentinel
      value: >-
        ${ (input.redis_type == 'sentinel')
             ? {
                 'master_name':     default(vars.sentinel_master_name, 'master'),
                 'quorum':          0,
                 'master_settings': merge(
                                       default(vars.sentinel_master_defaults, {}),
                                       default(input.sentinel_master_settings, {})
                                     ),
                 'settings':        default(input.sentinel_settings, {})
               }
             : {} }
