# L0 trial reshard: move N slots from master `from` to master `to`. Run roster —
# 3 hosts (3-master cluster); from=node-1, to=node-2, slots=100.
# The scenario builds a READY topology map (from/to = primary_ip:6379 by SID from the
# roster) and calls the plugin run_once. The SELECTION of the first N source slots and the
# actual transfer (SETSLOT/MIGRATE/SETSLOT NODE) is done by the PLUGIN at runtime via
# CLUSTER NODES — invisible at L0 (render does not execute Redis); ordering/losslessness are
# proven by plugin tests (cluster_test.go). ★ reshard is NOT idempotent — it's imperative,
# L0 does not "prove" this (see per-module doc); here we check the render contract.
name: reshard slots from source to target master

fixtures:
  default_destiny_source: "file://../../destiny/{name}"
  hosts:
    - sid: node-1.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.1 }
        os: { arch: amd64 }
    - sid: node-2.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.2 }
        os: { arch: amd64 }
    - sid: node-3.example.com
      covens: [redis]
      soulprint:
        network: { primary_ip: 10.0.0.3 }
        os: { arch: amd64 }
  state:
    redis_type: cluster
    redis_version: ""
    redis_config:
      maxmemory: "256mb"
      cluster-enabled: "yes"
      cluster-config-file: "nodes.conf"
      cluster-node-timeout: "5000"
    redis_users: []
    redis_hosts: []

    # ★ [ADR-0083] §4: create recorded the service's own accounts here -- only the
    # NAME; each password is a `type: secret` property living in Vault under a derived
    # path. The day-2 `core.state.set` task resolves THIS list into the register.
    system_acl_users:
      - { name: default_admin }

  input:
    from_sid: node-1.example.com
    to_sid: node-2.example.com
    slots: 100

mocks:
  # ★ [ADR-0083] §4: the passwords are the register result of the keeper-side
  # `core.state.set` task, which L0 renders but does not execute. Seeding the
  # register here is the consumer's post-resolution view -- the plaintext a Soul-side
  # task sees after the pipeline resolved each `vault:` reference. No case authors a
  # Vault path any more; the path is derived from (service, incarnation, field, key).
  register:
    system_acl_users:
      effective:
        - { name: default_admin, password: default-admin-secret-pass }

assert:
  # GUARD — assert: (from != to, both in roster → that[0] true → render passes,
  # task not emitted into the plan).
  task_present:
    # RESHARD run_once: endpoints from the roster by SID. from=node-1, to=node-2,
    # slots=100 (int() → native number). password from vault. The only
    # redis.cluster.* in the plan.
    - module: redis.cluster.resharded
      params_subset:
        username: default_admin
        password: default-admin-secret-pass
        slots: 100
        from:
          addr: "10.0.0.1:6379"
        to:
          addr: "10.0.0.2:6379"
