# Default service parameters.
#
# The `existing-vm` scenario takes the SIDs and the transport label as input, so
# there is nothing here it needs pre-seeded. The file stays as the anchor of the
# vars layer (ADR-0082): a fleet that needs different defaults forks this repo
# and edits this file.
#
# The provider/profile row names and the inline cloud tuple that used to live
# here belonged to the `create` / `create-inline` scenarios, which went with the
# CloudDriver contract in NIM-761.

join_wait_timeout: 15m
