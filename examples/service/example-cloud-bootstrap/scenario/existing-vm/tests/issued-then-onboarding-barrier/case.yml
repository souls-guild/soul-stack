# L0/Trial contract guard for ready-made VM onboarding. The issued register is
# mocked because Trial is render-only.
#
# Two things are the subject. The plan must carry the public chain that is left
# after NIM-834 removed `core.bootstrap.delivered` — mint, then the onboarding
# barrier over every minted SID. And it must NOT grow a delivery step back:
# task_absent is what would go red if somebody re-added the address, which the
# core catalog also refuses offline.
name: minting to the onboarding barrier

fixtures:
  hosts:
    - sid: vm-1.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
    - sid: vm-2.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
  input:
    sids: [vm-1.example.com, vm-2.example.com]

mocks:
  register:
    bootstrap:
      action: issued
      count: 2
      hosts:
        - { sid: vm-1.example.com, bootstrap_token: tok-vm1, expires_at: "2026-08-09T00:00:00Z" }
        - { sid: vm-2.example.com, bootstrap_token: tok-vm2, expires_at: "2026-08-09T00:00:00Z" }

assert:
  task_present:
    - module: core.bootstrap.issued
      params_subset:
        sids: [vm-1.example.com, vm-2.example.com]

    # Every minted SID reaches the barrier. Narrowing the list here would make
    # the run declare success over hosts nobody ever waited for.
    - module: core.soul.registered
      params_subset:
        sid: [vm-1.example.com, vm-2.example.com]
        await_online: true
        refresh_soulprint: true

  task_absent:
    - module: core.bootstrap.delivered
