# L0/Trial contract guard for ready-made VM onboarding. The issued register is
# mocked because Trial is render-only.
#
# Three things are the subject. The plan must carry the whole public chain —
# mint, install over the keeper-side SSH transport, then the barrier over every
# minted SID. The install step must feed the token through `stdin_from:` and
# never through `run:`, which is the one thing about it the engine enforces and
# the one a service author is most likely to get wrong. And the removed address
# must not come back: `task_absent` is what would go red if somebody re-added
# `core.bootstrap.delivered`, which the core catalog also refuses offline.
name: minting to the onboarding barrier

fixtures:
  hosts:
    - sid: vm-1.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
    - sid: vm-2.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
  input:
    sids: [vm-1.example.com, vm-2.example.com]
  # Trial takes service vars from here, not from vars/00-base.yaml — so these
  # repeat that file's values, and the rendered commands asserted below are
  # readable without opening it.
  vars:
    ssh_provider: vault-ssh
    soul_binary_url: https://dist.example.com/soul-stack/soul
    join_wait_timeout: 15m

mocks:
  register:
    bootstrap:
      action: issued
      count: 2
      hosts:
        - { sid: vm-1.example.com, bootstrap_token: tok-vm1, expires_at: "2026-08-09T00:00:00Z" }
        - { sid: vm-2.example.com, bootstrap_token: tok-vm2, expires_at: "2026-08-09T00:00:00Z" }

assert:
  task_present:
    - module: core.bootstrap.issued
      params_subset:
        sids: [vm-1.example.com, vm-2.example.com]

    # The install step takes the WHOLE host list, `onboarded` flag included: the
    # step skips a converged host itself, and re-mapping the list in the
    # scenario is how that flag gets dropped.
    - module: core.ssh.run
      params_subset:
        ssh_provider: vault-ssh
        steps:
          - run: "curl -fsSL https://dist.example.com/soul-stack/soul -o /usr/local/bin/soul && chmod 0755 /usr/local/bin/soul"
          - run: "install -d -m 0700 /etc/soul && umask 077 && cat > /etc/soul/token && chmod 0400 /etc/soul/token"
            stdin_from: bootstrap_token
          - run: 'test -e /var/lib/soul-stack/seed/current/cert.pem || SOUL_BOOTSTRAP_TOKEN="$(cat /etc/soul/token)" /usr/local/bin/soul init --config /etc/soul/soul.yml'
          - run: "systemctl daemon-reload && systemctl enable soul && systemctl start soul"

    # Every minted SID reaches the barrier. Narrowing the list here would make
    # the run declare success over hosts nobody ever waited for.
    - module: core.soul.registered
      params_subset:
        sid: [vm-1.example.com, vm-2.example.com]
        await_online: true
        refresh_soulprint: true

  task_absent:
    - module: core.bootstrap.delivered
