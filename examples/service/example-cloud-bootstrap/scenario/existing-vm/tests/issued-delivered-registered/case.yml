# L0/Trial contract guard for ready-made VM onboarding. The issued register is
# mocked because Trial is render-only; the plan must preserve the exact public
# chain and must not invent primary_ip for Teleport by-name delivery.
name: issued to teleport delivery to onboarding barrier

fixtures:
  hosts:
    - sid: vm-1.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
    - sid: vm-2.example.com
      covens: []
      soulprint:
        network: {}
        os: { arch: amd64 }
  input:
    sids: [vm-1.example.com, vm-2.example.com]
    ssh_provider: teleport-ready-vm
    join_wait_timeout: 20m

mocks:
  register:
    bootstrap:
      action: issued
      count: 2
      hosts:
        - { sid: vm-1.example.com, bootstrap_token: tok-vm1, expires_at: "2026-08-09T00:00:00Z" }
        - { sid: vm-2.example.com, bootstrap_token: tok-vm2, expires_at: "2026-08-09T00:00:00Z" }

assert:
  task_present:
    - module: core.bootstrap.issued
      params_subset:
        sids: [vm-1.example.com, vm-2.example.com]

    - module: core.bootstrap.delivered
      params_subset:
        ssh_provider: teleport-ready-vm
        install: true
        join_wait_timeout: 20m
        hosts:
          - { sid: vm-1.example.com, bootstrap_token: tok-vm1, expires_at: "2026-08-09T00:00:00Z" }
          - { sid: vm-2.example.com, bootstrap_token: tok-vm2, expires_at: "2026-08-09T00:00:00Z" }

    - module: core.soul.registered
      params_subset:
        sid: [vm-1.example.com, vm-2.example.com]
        await_online: true
        refresh_soulprint: true
