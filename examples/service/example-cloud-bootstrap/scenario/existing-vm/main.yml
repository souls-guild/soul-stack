name: existing-vm
create: true
description: >-
  Onboard ready-made VMs without creating them through a CloudDriver. Keeper
  atomically issues one token per FQDN/SID, installs and redeems it through the
  configured Teleport transport, then waits for every Soul to come online.

input:
  sids:
    type: array
    items:
      type: string
    required: true
    description: Non-empty unique FQDN/SID list of the ready-made VMs.
  ssh_provider:
    type: string
    required: true
    description: Audit label for bootstrap delivery (Teleport auth comes from Machine ID).
  join_wait_timeout:
    type: string
    required: false
    description: Maximum time to wait until each VM joins Teleport.

tasks:
  - name: Issue bootstrap tokens for ready-made VMs
    on: keeper
    module: core.bootstrap.issued
    register: bootstrap
    params:
      sids: "${ input.sids }"

  - name: Install Soul and deliver tokens through Teleport
    on: keeper
    module: core.bootstrap.delivered
    register: delivered
    require: [bootstrap]
    params:
      hosts: "${ register.bootstrap.hosts }"
      ssh_provider: "${ input.ssh_provider }"
      install: true
      join_wait_timeout: "${ has(input.join_wait_timeout) ? input.join_wait_timeout : '15m' }"

  - name: Await ready-made VM onboarding
    on: keeper
    module: core.soul.registered
    register: onboarded
    require: [delivered]
    params:
      sid: "${ register.bootstrap.hosts.map(h, h.sid) }"
      await_online: true
      refresh_soulprint: true
