name: existing-vm
create: true
description: >-
  Onboard ready-made VMs. Keeper atomically mints one bootstrap token per
  FQDN/SID, then waits for every Soul to come online. Installing the agent on
  each host and redeeming its token happens between the two steps and is NOT an
  engine step — see the README.

input:
  sids:
    type: array
    items:
      type: string
    required: true
    description: Non-empty unique FQDN/SID list of the ready-made VMs.

tasks:
  - name: Mint bootstrap tokens for ready-made VMs
    module: core.bootstrap.issued
    register: bootstrap
    params:
      sids: "${ input.sids }"

  # ── The host is installed HERE, and not by this scenario. ──────────────────
  #
  # `core.bootstrap.delivered` used to sit at this point; NIM-834 removed it,
  # because installing a host is different at every site and the engine has no
  # portable way to do it. Whatever fills this gap must do three things, each
  # one paid for by a live run and NONE of them satisfied by writing a file with
  # the token in it (ADR-063 amendment 2026-09-09):
  #
  #   1. REDEEM the token, not just place it — `soul init` behind the seed-cert
  #      guard. There is no soul-side pickup of a token file, and a bootstrap
  #      token is single-use, so an unguarded retry fails the host.
  #   2. Pass the token through STDIN, never argv — argv is visible in `ps`,
  #      `audit.log` and journald ON THE HOST ITSELF.
  #   3. Activate with `daemon-reload && enable && start`, or the unit does not
  #      come back after a reboot.
  #
  # Until that happens the hosts have no identity, and the barrier below waits
  # for a presence that cannot arrive: this run ends at the run timeout.

  - name: Await ready-made VM onboarding
    module: core.soul.registered
    register: onboarded
    require: [bootstrap]
    params:
      sid: "${ register.bootstrap.hosts.map(h, h.sid) }"
      await_online: true
      refresh_soulprint: true
