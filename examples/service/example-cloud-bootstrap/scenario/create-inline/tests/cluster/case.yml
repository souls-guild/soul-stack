# L0 topology 3/3 of the inline cloud source (NIM-668): cluster.
# The largest spec of the three. Together with standalone/sentinel this is the
# whole point of the ticket: three topologies out of one scenario, rendered from
# vars/, with not a single row in the providers or profiles registry.
name: cluster topology renders the large VM spec from vars, still no registry rows

fixtures:
  hosts:
    - sid: node-0.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.1 }
        os: { arch: amd64 }
    - sid: node-1.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.2 }
        os: { arch: amd64 }
    - sid: node-2.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.3 }
        os: { arch: amd64 }
    - sid: node-3.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.4 }
        os: { arch: amd64 }
    - sid: node-4.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.5 }
        os: { arch: amd64 }
    - sid: node-5.ns.vm.example
      covens: []
      soulprint:
        network: { primary_ip: 10.0.2.6 }
        os: { arch: amd64 }
  # Mock Vault KV for the `credentials:` ref (see the standalone case).
  vault:
    secret/cloud/wb-dev:
      access_key_id:     EXAMPLE-KEY-ID
      secret_access_key: EXAMPLE-NOT-A-REAL-SECRET
  # MIRROR of vars/00-base.yaml -> cloud (see the standalone case; equality is
  # pinned by TestInlineCloudCasesMirrorServiceVars).
  vars:
    cloud:
      driver:      wb
      region:      ru-central1
      fqdn_suffix: ns.vm.example
      profiles:
        standalone:
          image:         ubuntu-24-04
          instance_type: c2-m4
          disk:          { size_gb: 40, type: ssd }
        sentinel:
          image:         ubuntu-24-04
          instance_type: c2-m2
          disk:          { size_gb: 20, type: ssd }
        cluster:
          image:         ubuntu-24-04
          instance_type: c4-m8
          disk:          { size_gb: 100, type: ssd }
  input:
    topology: cluster
    count: 6
    name: node

mocks:
  register:
    provision:
      vm_ids: [i-c0, i-c1, i-c2, i-c3, i-c4, i-c5]
      hosts:
        - { sid: node-0.ns.vm.example, vm_id: i-c0, primary_ip: 10.0.2.1 }
        - { sid: node-1.ns.vm.example, vm_id: i-c1, primary_ip: 10.0.2.2 }
        - { sid: node-2.ns.vm.example, vm_id: i-c2, primary_ip: 10.0.2.3 }
        - { sid: node-3.ns.vm.example, vm_id: i-c3, primary_ip: 10.0.2.4 }
        - { sid: node-4.ns.vm.example, vm_id: i-c4, primary_ip: 10.0.2.5 }
        - { sid: node-5.ns.vm.example, vm_id: i-c5, primary_ip: 10.0.2.6 }

assert:
  task_present:
    - module: core.cloud.created
      params_subset:
        driver: wb
        region: ru-central1
        fqdn_suffix: ns.vm.example
        count: 6
        name: node
        self_onboard: true
        profile:
          image: ubuntu-24-04
          instance_type: c4-m8
          disk: { size_gb: 100, type: ssd }

    - module: core.soul.registered
      params_subset:
        sid:
          - node-0.ns.vm.example
          - node-1.ns.vm.example
          - node-2.ns.vm.example
          - node-3.ns.vm.example
          - node-4.ns.vm.example
          - node-5.ns.vm.example
        await_online: true
