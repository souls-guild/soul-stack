name: create-inline
create: true
description: >-
  Cloud-init bootstrap with ZERO rows in the providers/profiles registries
  (NIM-668). The sibling scenario `create` does the same run through the
  registry source; this one carries the whole tuple in the step:

    driver       - the CloudDriver plugin alias (was providers.type)
    credentials  - a vault: REFERENCE, resolved by keeper before the module runs
    region       - was providers.region
    fqdn_suffix  - was providers.fqdn_suffix
    profile      - the VM spec ITSELF (an object), not the name of a registry row

  Why this exists: a topology x size matrix cannot be expressed by registry
  names - each combination needs a row created by hand, and a service repo
  cannot ship rows. Here the three topologies are ordinary service data in
  vars/00-base.yaml, so `topology: cluster` renders a complete VM spec with
  nothing pre-seeded in Postgres.

  ★ `credentials` is written LITERALLY, not through an expression. The
  vault-resolve phase walks the RAW params and runs BEFORE the CEL phase
  (ADR-010), so a ref produced by `${ ... }` would never be resolved - it would
  reach the module as a plain string and the step would refuse it, naming the
  vault: form. Everything else here may come from vars.

input:
  topology:
    type: string
    required: true
    description: >-
      Which VM spec of vars.cloud.profiles to provision: standalone | sentinel |
      cluster. The value indexes the map - an unknown name is a render error,
      not a silently empty profile.
  count:
    type: integer
    required: false
    description: Number of VMs in the batch (default 1).
  name:
    type: string
    required: true
    description: >-
      Base name of the VM batch: keeper passes it into CreateRequest.name, the
      driver names them <name>-<index>, and the FQDN <name>-<i>.<fqdn_suffix>
      is predictable before create. Required - this scenario self-onboards.

tasks:
  # Step 1: create the VMs. No `provider:` here - naming it alongside the inline
  # pair is refused by the module (one source, never both), so this step cannot
  # half-drift onto the registry.
  - name: Provision VMs from vars (no registry rows)
    on: keeper
    module: core.cloud.created
    register: provision
    params:
      driver:       "${ vars.cloud.driver }"
      # The one param written literally rather than through `${ vars.cloud.* }`:
      # keeper reads vault BEFORE it renders `${ … }` (ADR-010 phase order), so a
      # ref an expression produces arrives after the read and nothing resolves it.
      credentials:  vault:secret/cloud/wb-dev
      region:       "${ vars.cloud.region }"
      fqdn_suffix:  "${ vars.cloud.fqdn_suffix }"
      profile:      "${ vars.cloud.profiles[input.topology] }"
      count:        "${ has(input.count) ? input.count : 1 }"
      name:         "${ input.name }"
      self_onboard: true

  # Step 2: registration of the created SIDs + blocking onboarding barrier
  # (core.soul.registered, ADR-061). Self-onboard needs no delivery step - the
  # VM picks its own token out of userdata in its first cloud-init cycle.
  - name: Register provisioned VMs and await their onboarding
    on: keeper
    module: core.soul.registered
    register: onboarded
    require:
      - provision
    params:
      sid:          "${ register.provision.hosts.map(h, h.sid) }"
      await_online: true
