# Mirror the release .deb assets into the Cloudflare R2 apt repo (NIM-174). Runs on a
# GitHub-hosted runner because there is no self-hosted machine to keep online; the job is
# short and rare, so the metered minutes of a PRIVATE repository are not an argument
# against it. (This header claimed the repository was public until NIM-879 checked:
# `gh api repos/souls-guild/soul-stack -q .private` → true. The security argument below
# was resting on that.) The R2 write key and the apt signing key live in repo secrets;
# both triggers below require write access, and a private repository has no untrusted
# fork PRs to leak them to. The R2 token is scoped to write only the apt bucket, and the
# GPG key is a dedicated apt-signing key (not a personal key) — a bounded, rotatable
# blast radius.
#
# ★ THIS IS A PUBLISHING PATH THE RELEASE GATE DOES NOT COVER (NIM-879). It fires on
# `release: published` — ANY release, including one a human creates by hand with
# `gh release create` from locally built artifacts. release.yml's `live-gate` blocks
# goreleaser, not this. Closing that path needs a repository ruleset on who may publish
# a release, which is an organisation setting rather than a file here.
name: Publish apt (R2)

on:
  release:
    types: [published]
  # Manual (re-)publish for an already-released tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (e.g. v0.1.0-beta.1)"
        required: true

permissions:
  contents: read # download the release .deb assets

# One publish at a time; a newer run waits rather than racing the bucket.
concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    name: mirror .deb → R2 apt pool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tooling (apt-utils, rclone, gnupg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils rclone gnupg

      - name: Configure rclone remote for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: |
          rclone config create r2_soul_stack_apt s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --non-interactive >/dev/null

      - name: Import apt signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download release .deb assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist/pkg && mkdir -p dist/pkg
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R "${{ github.repository }}" -p '*.deb' -D dist/pkg

      - name: Publish to R2
        env:
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
        run: deploy/apt-r2/publish-apt.sh
