# Nightly Soul Stack. Heavy targets that shouldn't block every PR,
# but must run regularly. See ADR-039 (E2E levels) and docs/testing/.
#
# Contents:
#   - e2e-live:    L3b real-soul-in-container (Makefile target `e2e-live`):
#                  real soul binary in a privileged container, full
#                  gRPC-handshake + apply/Scry pipeline. This is the BROAD tier —
#                  every test behind the e2e_live tag. The five curated ones that
#                  block a release are `make e2e-live-gate`, run from release.yml.
#
name: Nightly

# Manual-only (workflow_dispatch — from the UI or `gh workflow run`). No schedule.
#
# ★ AS OF NIM-879 (2026-09-14) THIS WORKFLOW HAD NEVER RUN, not once since it was
# added at v0.1.0-beta.1 — `gh run list --workflow=nightly.yml` returned []. It also
# carried `continue-on-error: true` until that ticket removed it, so even a manual run
# could not have failed anything. Read that before treating its existence as coverage
# of L3b: until then the live tier ran in no CI at all, which is how `make
# e2e-live-gate` stayed red on the release tip from migration 118 until a human ran it
# by hand.
#
# The text here used to justify the missing schedule by saying `e2e-live` had moved
# to the local pre-tag gate and therefore "already has an owner". It had no owner —
# that was the defect. It has one now: `.github/workflows/release.yml` runs
# `make e2e-live-gate` as a blocking job on the tagged sha, and goreleaser is behind
# it. A tag is the moment the answer is needed, and that is where it is taken.
#
# What a schedule would still buy is finding rot BEFORE tag day rather than on it,
# and that was weighed and declined (NIM-879): this repository is PRIVATE — the
# earlier note here claiming it is public, and Actions minutes therefore unmetered,
# was wrong — so the 2000 min/month limit applies and a daily hour of L3b would
# consume most of it. To restore a periodic run, add `schedule:` below — and do not
# bring `continue-on-error` back with it; a scheduled job that cannot fail repeats this
# file's own history.
#
# `race-tests` (`make test-race`) USED to live here and no longer does — it is a
# blocking job in ci.yml (NIM-312). Here it produced nothing: no schedule meant it
# never ran on its own, and `continue-on-error: true` meant a race found on a
# manual run did not fail anything. Keeping a second, advisory copy alongside the
# real gate would only re-create the question of which one to believe.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versions in sync with ci.yml — single toolchain.
  PROTOC_VERSION: "34.1"
  PROTOC_GEN_GO_VERSION: "v1.36.11"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.6.2"
  GO_VERSION: "1.26.6"

jobs:
  # L3b real-soul-in-container (ADR-039 level B). Instead of a soul-stub, runs
  # the real `soul` binary inside a privileged container: covers the whole gRPC
  # handshake + apply/Scry pipeline (including a real SoulModule.Plan in the drift
  # test).
  #
  # `continue-on-error: true` is GONE (NIM-879). It made this job incapable of
  # failing, on the only tier nothing else covers — so the one way to learn
  # anything from it was to read the log, which is the definition of a result
  # nobody reads. A dispatched run now concludes what it found. Infrastructure
  # flakiness on the runner (docker-in-docker, privileged, systemd-PID-1) is a
  # real possibility and is the reason this tier is dispatched rather than
  # scheduled; it is not a reason for its verdict to be unreadable.
  e2e-live:
    name: e2e-live (L3b real-soul-in-container)
    runs-on: ubuntu-latest
    # Unchanged. That the five-test gate in release.yml gets 90 while this superset gets 60
    # is a real inversion — it follows the `go test` budgets, 45m there against 30m here —
    # and it is NIM-512, not this ticket.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            keeper/go.sum
            proto/go.sum
            proto/plugin/go.sum
            sdk/go.sum
            shared/go.sum
            soul/go.sum
            soul-lint/go.sum
            soulctl/go.sum
            tests/e2e/go.sum

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ZIP}"
          curl -fsSL -o /tmp/protoc.zip "$URL"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local

      - name: Install protoc-gen-go plugins
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make build (needs a built soul + keeper for L3b)
        run: make build

      # Target `e2e-live` is implemented (Makefile) — run the live suite. The grep
      # guard is left as insurance against accidentally dropping the target: when it's
      # missing, prints diagnostics instead of `make: *** No rule`. grep on start-of-line +
      # `:` catches exactly the target declaration, not a mention in comments.
      - name: make e2e-live
        env:
          KEEPER_BIN: ${{ github.workspace }}/keeper/bin/keeper
        run: |
          set -euo pipefail
          if grep -q '^e2e-live:' Makefile; then
            make e2e-live
          else
            echo "make e2e-live: target missing from Makefile — check for a regression" >&2
            exit 1
          fi

      - name: Upload e2e-live artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-live-logs
          if-no-files-found: ignore
          path: |
            tests/e2e/_artifacts/
            /tmp/keeper-*.log
            /tmp/keeper-dev/
