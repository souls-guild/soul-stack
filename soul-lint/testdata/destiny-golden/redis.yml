name: redis
description: >-
  Режим-агностичный per-host кирпич Redis (B-гибрид
  ADR-009): установка пакета + render redis.conf из merged-конфига + render
  users.acl + systemd hardening drop-in + сервис.

# Regression fixture of a valid typed destiny, aligned with the redis destiny
# (github.com/soul-stack-destiny/redis, the typed version/config/users form). NOT a
# byte copy of it — a minimal manifest of its own, which soul-lint
# validate-destiny accepts with exit 0. NOT with zero diagnostics, which this line
# used to claim: since NIM-783 the command also judges the `tasks/main.yml` beside
# the manifest, and a bare fixture in a flat directory has none — so it carries one
# `destiny_tasks_unchecked` hint, which is a property of where this file lives and
# not of what it says. The regression contract: both this fixture and the pinned
# destiny validate (validate_test.go TestGolden_DestinyExample[_FromRepo]). Any
# substantive divergence from the destiny schema is a bug the test catches.

input:
  version:
    type: string
    required: false
    # distro-native: опциональный epoch `N:` + upstream-версия + ревизия.
    pattern: "^([0-9]+:)?[0-9][A-Za-z0-9.~+-]*$"
    description: >-
      Версия пакета redis-server (distro-native, напр. 5:7.0.15-1~deb12u7).
      Опциональна: не задана → версия по умолчанию из репозитория.

  password:
    type: string
    required: true
    secret: true
    min_length: 16
    description: >-
      Пароль Redis (requirepass). Destiny получает УЖЕ зарезолвленное keeper-side
      значение и кладёт его в redis.conf (ADR-012); vault-клиент не тянет.

  # Готовые директивы redis.conf (merged на стороне scenario сервиса).
  config:
    type: object
    description: >-
      Готовые директивы redis.conf (merged caller-ом). Каждая пара key→value
      пишется в redis.conf как есть. Destiny НЕ мержит повторно.
    properties:
      maxclients:
        type: integer
        min: 1
      timeout:
        type: integer
        min: 0
    additional_properties: true

  # ACL-пользователи Redis: MAP имя→{perms, state, password}.
  users:
    type: object
    required: false
    description: >-
      ACL-пользователи Redis (map имя→{perms, state, password}). Рендерятся в
      /etc/redis/users.acl, порядок строк детерминирован (range по map сортирует
      ключи); password — зарезолвленный keeper-side секрет, в файл пишется его
      sha256-хеш.
    properties: {}
    additional_properties:
      type: object
      additional_properties: false
      properties:
        perms:
          required: true
          type: string
        state:
          required: true
          type: string
          enum: [on, off]
        password:
          required: true
          type: string
          secret: true
