# NIM-716 is the neighbouring defect where such an error, linted OUTSIDE a service
# tree, is downgraded to a `stage_include_unresolved` hint with exit 0 — a message
# that says the include did not resolve when it resolved and was read. A tree run
# is inside a service tree by construction, so it must report the body's own
# errors at the body's own coordinates.
