name: compute-out-of-scope
compute:
  node_count: ${ 1 + 2 }
tasks:
  # A keeper-side task renders in the run-level context, which has no compute
  # namespace at all — the old failure named the key instead (NIM-619).
  - name: Register the computed node
    module: core.soul.registered
    on: keeper
    params:
      sid: node-${ compute.node_count }.example.com

  # Task-level vars: layer onto that very same context, so they are no way around.
  - name: Register through a task var
    module: core.soul.registered
    on: keeper
    vars:
      sid: node-${ compute.node_count }.example.com
    params:
      sid: ${ vars.sid }

  # on: [covens] resolves once per run, before any host is chosen.
  - name: Roll the computed coven
    module: core.exec.run
    on:
      - ${ "web-" + string(compute.node_count) }
    params:
      cmd: /usr/bin/true

  # The loop axis is host-invariant and equally without the namespace.
  - name: Fan out over the computed axis
    module: core.exec.run
    loop:
      items: ${ compute.node_count }
      as: idx
      when: compute.node_count > 1
    params:
      cmd: echo ${ idx }
