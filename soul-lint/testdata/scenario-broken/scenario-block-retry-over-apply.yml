name: block-retry-over-apply
tasks:
  # A block's retry: is every child's default, and an applier child would hand it
  # to destiny tasks their author never marked retryable (NIM-910).
  - name: Converge the cluster
    retry:
      count: 3
    block:
      - name: Install the agent package
        module: core.pkg.installed
        params:
          name: soul
      - name: Roll the redis destiny over the cluster
        apply:
          destiny: redis
          input:
            action: apply
