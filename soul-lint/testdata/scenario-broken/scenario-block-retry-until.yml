name: block-retry-until
tasks:
  # until: re-judges one module's result; on a block it would judge every child's,
  # whatever its module returns (NIM-910).
  - name: Wait for the service
    retry:
      count: 5
      until: register.self.changed
    block:
      - name: Restart redis
        module: core.service.restarted
        params:
          name: redis
