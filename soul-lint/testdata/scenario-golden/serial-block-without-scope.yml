name: serial-block-without-scope
tasks:
  # No serial_scope: the block rolls by task. Upgrade reaches every host two at a
  # time, then check does; a canary writes settings: {serial_scope: block}.
  - name: Upgrade then check, two hosts at a time
    serial: 2
    block:
      - name: Upgrade redis
        module: core.pkg.installed
        params:
          name: redis
      - name: Check redis answers
        module: core.exec.run
        params:
          cmd: redis-cli
          args: ["ping"]
