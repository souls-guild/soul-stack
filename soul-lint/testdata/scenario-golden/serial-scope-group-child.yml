name: serial-scope-group-child
tasks:
  - name: Upgrade then check, two hosts at a time
    serial: 2
    settings:
      serial_scope: block
    block:
      - name: Upgrade redis
        module: core.pkg.installed
        # Not read: the group has one width, the block's own.
        serial: 1
        params:
          name: redis
      - name: Check redis answers
        module: core.exec.run
        params:
          cmd: redis-cli
          args: ["ping"]
