name: serial-task-beside-a-host-step
tasks:
  # Each step rolls at its own width: the upgrade two hosts at a time, then the
  # check on every host in one wave. The staged rollback carried both in one wave
  # loop of two.
  - name: Upgrade redis
    module: core.pkg.installed
    serial: 2
    params:
      name: redis
  - name: Check redis answers
    module: core.exec.run
    params:
      cmd: redis-cli
      args: ["ping"]
