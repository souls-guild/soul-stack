name: compute-in-scope
description: compute.* where the namespace exists, and words that only look like it (NIM-619)
input:
  hosts:
    type: array
    required: true
    items:
      type: string
  compute_timeout:
    type: string
compute:
  node_count: ${ size(input.hosts) }
tasks:
  # In scope: an ordinary Soul-side task reads the namespace in params:.
  - name: use the computed count on each host
    module: core.exec.run
    params:
      cmd: echo ${ compute.node_count }

  # In scope on the keeper side too (NIM-619): `on: keeper` renders in the very
  # run-level context compute was resolved in. Alongside it, two things that only
  # LOOK like the namespace — a literal coven label containing the word and an
  # input field whose name starts with it. A rule built on a regex would flag both
  # and push authors to rename unrelated things.
  - name: register the seed from the keeper side
    module: core.soul.registered
    vars:
      label: node-${ compute.node_count }
    params:
      sid: ${ input.hosts[0] }
      coven:
        - compute-cluster
        - ${ vars.label }
      await_online: true
      await_timeout: ${ input.compute_timeout }

  # The detour for the flow-control keys, which Soul evaluates in a sandbox
  # without the namespace: task `vars:` ARE rendered by the Keeper, with compute
  # in scope, and the rendered value is what the predicate reads.
  - name: gate on a computed value through vars
    module: core.exec.run
    vars:
      n: ${ compute.node_count }
    when: vars.n > 1
    params:
      cmd: /usr/bin/true

  # Out of scope, driven by a list the axis can actually see.
  - name: fan out over the declared hosts
    module: core.exec.run
    loop:
      items: ${ input.hosts }
      as: h
      when: h != ""
    params:
      cmd: echo ${ h }
