name: block-retry-timeout
description: "A block's retry and timeout are defaults its children inherit and may override (NIM-910)."

tasks:
  - name: Fetch the release artifacts
    retry:
      count: 5
      delay: 10s
    timeout: 5m
    block:
      - name: Fetch the bundle
        module: core.url.fetched
        params:
          url: https://example.com/bundle.tar.gz
          path: /var/cache/app/bundle.tar.gz
      - name: Fetch the checksum, one attempt
        module: core.url.fetched
        retry:
          count: 1
        timeout: 30s
        params:
          url: https://example.com/bundle.sha256
          path: /var/cache/app/bundle.sha256
      - name: Unpack the bundle
        module: core.exec.run
        retry:
          count: 3
          until: register.self.changed
        settings:
          task_timeout: 1h
        params:
          cmd: tar
          args: ["-xzf", /var/cache/app/bundle.tar.gz, "-C", /srv/app]
