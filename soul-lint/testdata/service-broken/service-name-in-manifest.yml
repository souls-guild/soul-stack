# NIM-726: `name:` left the manifest. A service is named once, at registration, and
# nothing ever compared this copy against that one — so a manifest naming the wrong
# service silently fenced the wrong Vault namespace. The key is refused rather than
# ignored: a key the author reads as identity and the engine reads as nothing is the
# worse of the two failures.
name: redis
state_schema:
  foo: { type: string }
