# NIM-745: the flat `certificate_rotation:` key was renamed to a `certificate:` section
# with the rotation policy nested under `rotate:`, and `pki_role` moved up a level —
# the role is what a cert is ISSUED with, and issuance is not only rotation, so it
# stopped being conditional on `enable: true`. Three manifests carried the old key and
# all three were ours, so the key is refused outright rather than read for a window:
# a rotation policy the engine silently ignores is the worse of the two failures.
state_schema:
  foo: { type: string }
certificate_rotation:
  enable: true
  scenario: rotate_tls
  threshold: 30d
  pki_role: redis-server
